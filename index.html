<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>MGOT World Strategy</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#070b18;
    color:white;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#111827;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:none;
    border-radius:8px;
    background:#0891b2;
    color:white;
    cursor:pointer;
}

.good{color:#34d399;}
.bad{color:#f87171;}
.warn{color:#fbbf24;}
</style>
</head>

<body>

<div class="container">

<h1>🧠 MGOT — WORLD STRATEGY</h1>

<div class="card">
<h3>🌍 CIVILIZATION</h3>

💰 Economy: <span id="e">50</span><br>
🧠 Research: <span id="r">50</span><br>
⚔ Military: <span id="m">50</span><br>
⚖ Stability: <span id="s">100</span>
</div>

<div class="card">
<h3>🤖 AI CIVILIZATION</h3>
AI Power: <span id="ai">80</span>
</div>

<div class="card">
<h3>🎮 ACTIONS (TURN)</h3>

<button onclick="act('eco')">💰 Invest Economy</button>
<button onclick="act('res')">🧠 Research</button>
<button onclick="act('mil')">⚔ Build Military</button>
</div>

<div class="card">
<h3>⚠ WORLD EVENT</h3>
<div id="event" class="warn">World is stable...</div>
</div>

<div class="card">
<h3>🏆 STATUS</h3>
<div id="status">Survive and grow</div>
</div>

</div>

<script>

let e=50,r=50,m=50;
let s=100;
let ai=80;

function power(){
return e+r+m;
}

function event(){

let events=[
"💥 Economic shock in global markets",
"⚠ AI expansion detected",
"📈 Research breakthrough available",
"⚔ Border tensions rising",
"🌍 Stability pressure increasing"
];

document.getElementById("event").innerText =
events[Math.floor(Math.random()*events.length)];
}

function aiTurn(){

ai += Math.random()*10;

if(ai > power()){
s -= 10;
e -= 5;
m -= 5;

document.getElementById("status").innerHTML =
"<span class='bad'>⚠ AI is ahead of your civilization!</span>";
}
}

function act(type){

event();

if(type==='eco'){
e += 10;
s -= 3;
}

if(type==='res'){
r += 10;
e -= 5;
}

if(type==='mil'){
m += 10;
e -= 5;
}

aiTurn();
check();
update();
}

function check(){

if(s <= 0){
document.getElementById("status").innerHTML =
"<span class='bad'>💀 CIVILIZATION COLLAPSED</span>";
}

if(ai > 200){
document.getElementById("status").innerHTML =
"<span class='bad'>🤖 AI DOMINATED WORLD</span>";
}

if(power() > 300){
document.getElementById("status").innerHTML =
"<span class='good'>🏆 YOU ACHIEVED GLOBAL DOMINANCE</span>";
}
}

function update(){

document.getElementById("e").innerText=Math.floor(e);
document.getElementById("r").innerText=Math.floor(r);
document.getElementById("m").innerText=Math.floor(m);
document.getElementById("s").innerText=Math.floor(s);
document.getElementById("ai").innerText=Math.floor(ai);
}

setInterval(event,5000);

update();

</script>

</body>
</html>
