<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MGOT Empire War v1</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle at top,#0b1b3a,#020617 70%,#000);
color:#dbeafe;
}

.container{
max-width:900px;
margin:auto;
padding:12px;
}

h1{
text-align:center;
color:#38bdf8;
text-shadow:0 0 10px #38bdf8;
}

.card{
background:rgba(15,23,42,0.9);
border:1px solid #1e3a8a;
padding:12px;
border-radius:12px;
margin-bottom:10px;
box-shadow:0 0 10px rgba(56,189,248,0.2);
}

button{
width:100%;
padding:12px;
margin-top:6px;
border:none;
border-radius:10px;
background:#0ea5e9;
color:white;
}

button:active{transform:scale(0.98);}

.good{color:#34d399;}
.bad{color:#f87171;}
</style>
</head>

<body>

<div class="container">

<h1>🏰 MGOT EMPIRE WAR v1</h1>

<div class="card">
<h3>🏗 BASE</h3>
💰 Gold: <span id="g">100</span><br>
🪵 Wood: <span id="w">100</span><br>
⚔ Defense: <span id="d">50</span><br>
🧠 Tech: <span id="t">50</span>
</div>

<div class="card">
<h3>⚙ BUILD</h3>

<button onclick="build('gold')">⛏ Gold Mine (+income)</button>
<button onclick="build('wood')">🌲 Lumber Camp (+income)</button>
<button onclick="build('def')">🛡 Defense Tower (+defense)</button>
<button onclick="build('tech')">🧠 Research Lab (+tech)</button>
</div>

<div class="card">
<h3>⚔ RAID EVENT</h3>
<div id="event">Peaceful world...</div>

<button onclick="raid()">⚔ DEFEND RAID</button>
</div>

<div class="card">
<h3>🏆 STATUS</h3>
<div id="status">Build your empire</div>
</div>

</div>

<script>

let g=100,w=100,d=50,t=50;

function income(){
g += 5;
w += 5;
}

function build(type){

if(type==='gold' && g>=20){
g -= 20;
g += 5;
}

if(type==='wood' && w>=20){
w -= 20;
w += 5;
}

if(type==='def' && g>=30){
g -= 30;
d += 10;
}

if(type==='tech' && g>=40){
g -= 40;
t += 10;
}

update();
}

function raid(){

let enemy = Math.random()*100 + 20;

if(d + t > enemy){
document.getElementById("status").innerHTML =
"<span class='good'>🏆 RAID DEFENDED</span>";
g += 20;
w += 20;
}
else{
document.getElementById("status").innerHTML =
"<span class='bad'>💀 BASE LOOTED</span>";
g -= 30;
w -= 30;
}
update();
}

function event(){

let events=[
"⚔ Enemy scouts detected",
"💥 Barbarian raid incoming",
"📈 Economy stabilizing",
"🧠 Tech breakthrough possible",
"🌍 Peaceful expansion window"
];

document.getElementById("event").innerText =
events[Math.floor(Math.random()*events.length)];
}

function update(){
document.getElementById("g").innerText=Math.floor(g);
document.getElementById("w").innerText=Math.floor(w);
document.getElementById("d").innerText=Math.floor(d);
document.getElementById("t").innerText=Math.floor(t);
}

setInterval(()=>{
income();
event();
update();
},3000);

update();

</script>

</body>
</html>
