<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>MGOT Strategy Real</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1020;
    color:white;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#111827;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:12px;
    margin-top:8px;
    background:#0891b2;
    border:none;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.bad{color:#f87171;}
.good{color:#34d399;}
.neutral{color:#fbbf24;}
</style>
</head>

<body>

<div class="container">

<h1>🧠 MGOT — REAL STRATEGY SIM</h1>

<div class="card">
<h3>📊 CIVILIZATION STATE</h3>

🧠 Knowledge: <span id="k">50</span><br>
⚡ Economy: <span id="e">50</span><br>
👥 Society: <span id="c">50</span><br>
⚖ Stability: <span id="s">100</span>
</div>

<div class="card">
<h3>⚙️ STRATEGIC DECISION (TURN)</h3>

<button onclick="decision('growth')">📈 Focus Growth (risk instability)</button>
<button onclick="decision('stability')">🛡 Focus Stability (slow growth)</button>
<button onclick="decision('research')">🧠 Focus Research (long-term boost)</button>
</div>

<div class="card">
<h3>🌍 WORLD EVENTS</h3>
<div id="event" class="neutral">Waiting for system evolution...</div>
</div>

<div class="card">
<h3>📉 SYSTEM PRESSURE</h3>
<div id="pressure">Stable</div>
</div>

</div>

<script>

let k=50,e=50,c=50;
let s=100;

function randomEvent(){

let events=[
"💥 Market instability rises",
"📉 Population stress detected",
"📈 Innovation surge appears",
"⚠ Resource imbalance growing",
"🌍 Global demand increases"
];

return events[Math.floor(Math.random()*events.length)];
}

function decision(type){

if(type==="growth"){
k+=10; e+=10; c+=5;
s-=15;
document.getElementById("event").innerHTML =
"<span class='bad'>📈 Aggressive growth chosen</span>";
}

if(type==="stability"){
s+=10;
k-=2; e-=2;
document.getElementById("event").innerHTML =
"<span class='good'>🛡 Stabilizing system</span>";
}

if(type==="research"){
k+=15;
e-=10;
s-=5;
document.getElementById("event").innerHTML =
"<span class='neutral'>🧠 Long-term investment</span>";
}

systemTick();
update();
}

function systemTick(){

let ev = randomEvent();
document.getElementById("pressure").innerText = ev;

// natural decay system (IMPORTANT)
k -= 2;
e -= 2;
c -= 2;

s -= 1;

// consequences
if(s < 60){
k -= 5;
e -= 5;
c -= 5;
}
}

function update(){

document.getElementById("k").innerText=Math.floor(k);
document.getElementById("e").innerText=Math.floor(e);
document.getElementById("c").innerText=Math.floor(c);
document.getElementById("s").innerText=Math.floor(s);

}

update();

</script>

</body>
</html>
