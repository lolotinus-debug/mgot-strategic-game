<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGOT Core A - Simulation</title>

<style>
body{
    margin:0;
    background:#050b1a;
    color:white;
    font-family:Arial;
    overflow:hidden;
}

#top{
    height:60px;
    background:#0b1224;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    border-bottom:1px solid #24314f;
}

#map{
    position:relative;
    height:calc(100vh - 60px);
    background:radial-gradient(circle,#1a2a55,#050b1a);
}

.city{
    position:absolute;
    width:14px;
    height:14px;
    background:#fbbf24;
    border-radius:50%;
    cursor:pointer;
    box-shadow:0 0 10px #fbbf24;
}

#panel{
    position:absolute;
    top:60px;
    right:0;
    width:320px;
    height:calc(100vh - 60px);
    background:#0b1224;
    border-left:1px solid #24314f;
    padding:10px;
    overflow:auto;
}

button{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.build{background:#22c55e;}
.upg{background:#3b82f6;}

.stat{
    font-size:13px;
    margin:4px 0;
    color:#94a3b8;
}
</style>
</head>

<body>

<div id="top">
    <b>MGOT CORE SIM A</b>
    <div>
        💰 <span id="money">1000</span>
        👥 <span id="pop">100</span>
        🧠 <span id="mgot">0</span>
    </div>
</div>

<div id="map">

    <div class="city" style="top:40%;left:50%" onclick="selectCity(0)"></div>
    <div class="city" style="top:30%;left:30%" onclick="selectCity(1)"></div>
    <div class="city" style="top:60%;left:70%" onclick="selectCity(2)"></div>

</div>

<div id="panel">

    <h3 id="cityName">City</h3>

    <div class="stat" id="stats"></div>

    <button class="build" onclick="buildFarm()">Farm (+food)</button>
    <button class="build" onclick="buildFactory()">Factory (+money)</button>
    <button class="upg" onclick="upgradeCity()">Upgrade (+MGOT)</button>

</div>

<script>

let cities = [
{
    name:"Capital",
    pop:100,
    money:500,
    food:100,
    stability:100,
    mgot:0,
    farms:1,
    factories:0
},
{
    name:"North",
    pop:60,
    money:300,
    food:80,
    stability:90,
    mgot:0,
    farms:1,
    factories:0
},
{
    name:"East",
    pop:80,
    money:400,
    food:90,
    stability:95,
    mgot:0,
    farms:1,
    factories:0
}
];

let selected = 0;

function selectCity(i){
    selected = i;
    render();
}

function buildFarm(){
    let c = cities[selected];
    if(c.money>=100){
        c.money-=100;
        c.farms++;
    }
    render();
}

function buildFactory(){
    let c = cities[selected];
    if(c.money>=150){
        c.money-=150;
        c.factories++;
    }
    render();
}

function upgradeCity(){
    let c = cities[selected];
    if(c.money>=200){
        c.money-=200;
        c.stability+=5;
        c.mgot+=5;
    }
    render();
}

function sim(){

    for(let c of cities){

        // food production
        c.food += c.farms * 5;

        // money production
        c.money += c.factories * 10;

        // population consumption
        c.food -= c.pop * 0.2;

        // starvation / growth
        if(c.food < 0){
            c.pop -= 1;
            c.stability -= 2;
        } else {
            c.pop += 0.2;
        }

        // MGOT generation = good management
        c.mgot += (c.stability / 100) * 0.5;

        // collapse check
        if(c.stability <= 0){
            c.pop = Math.max(10, c.pop * 0.5);
            c.stability = 50;
        }
    }

    render();
}

function render(){

    let c = cities[selected];

    document.getElementById("cityName").innerText = c.name;

    document.getElementById("money").innerText = Math.floor(c.money);
    document.getElementById("pop").innerText = Math.floor(c.pop);
    document.getElementById("mgot").innerText = Math.floor(c.mgot);

    document.getElementById("stats").innerHTML =
        "Money: "+Math.floor(c.money)+"<br>"+
        "Population: "+Math.floor(c.pop)+"<br>"+
        "Food: "+Math.floor(c.food)+"<br>"+
        "Stability: "+Math.floor(c.stability)+"<br>"+
        "Farms: "+c.farms+"<br>"+
        "Factories: "+c.factories;
}

setInterval(sim, 1500);
render();

</script>

</body>
</html>
