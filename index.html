<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MGOT Strategy</title>
<style>
body {
    margin: 0;
    background: #020617;
    overflow: hidden;
    font-family: Arial;
}
canvas {
    display: block;
    margin: 0 auto;
    background: radial-gradient(circle at center, #0f172a, #020617);
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const GRID = 40;
const COLS = Math.floor(canvas.width / GRID);
const ROWS = Math.floor(canvas.height / GRID);

class Unit {
    constructor(x, y, team) {
        this.x = x;
        this.y = y;
        this.team = team;
        this.hp = 100;
        this.target = null;
        this.color = team === "player" ? "#00d4ff" : "#ff3b3b";
    }

    moveToward(tx, ty) {
        if (this.x < tx) this.x++;
        if (this.x > tx) this.x--;
        if (this.y < ty) this.y--;
        if (this.y > ty) this.y++;
    }

    update(enemies) {
        // attack logic
        for (let e of enemies) {
            if (Math.abs(e.x - this.x) < 1 && Math.abs(e.y - this.y) < 1) {
                e.hp -= 1;
                if (e.hp <= 0) enemies.splice(enemies.indexOf(e), 1);
                return;
            }
        }

        // move
        if (this.target) {
            this.moveToward(this.target.x, this.target.y);
        }
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x * GRID, this.y * GRID, GRID - 2, GRID - 2);

        // HP bar
        ctx.fillStyle = "green";
        ctx.fillRect(this.x * GRID, this.y * GRID - 5, (GRID - 2) * (this.hp / 100), 3);
    }
}

let playerUnits = [
    new Unit(5, 5, "player"),
    new Unit(6, 5, "player")
];

let aiUnits = [
    new Unit(15, 10, "ai"),
    new Unit(16, 10, "ai")
];

// AI simple behaviour
function updateAI() {
    for (let ai of aiUnits) {
        let target = playerUnits[0];
        if (target) {
            ai.target = target;
        }
    }
}

canvas.addEventListener("click", (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) / GRID);
    const y = Math.floor((e.clientY - rect.top) / GRID);

    // move all player units to click
    playerUnits.forEach(u => {
        u.target = {x, y};
    });
});

function drawGrid() {
    ctx.strokeStyle = "#1e293b";
    for (let x = 0; x < COLS; x++) {
        for (let y = 0; y < ROWS; y++) {
            ctx.strokeRect(x * GRID, y * GRID, GRID, GRID);
        }
    }
}

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawGrid();

    updateAI();

    for (let u of playerUnits) u.update(aiUnits);
    for (let a of aiUnits) a.update(playerUnits);

    for (let u of playerUnits) u.draw();
    for (let a of aiUnits) a.draw();

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
