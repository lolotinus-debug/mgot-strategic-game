<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>MGOT PLAYABLE</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1020;
    color:white;
}

.header{
    text-align:center;
    padding:15px;
    color:#22d3ee;
    font-size:20px;
}

.container{
    max-width:900px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    padding:15px;
}

.panel{
    background:#111827;
    padding:15px;
    border-radius:12px;
}

.stat{
    margin:6px 0;
    display:flex;
    justify-content:space-between;
}

button{
    width:100%;
    padding:10px;
    margin-top:6px;
    background:#0891b2;
    border:none;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.node{
    padding:8px;
    background:#0f172a;
    margin-top:6px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid #1f2937;
}

.active{
    border:2px solid #22d3ee;
}

.log{
    font-size:12px;
    color:#94a3b8;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="header">🧠 MGOT — PLAYABLE STRATEGY FIXED</div>

<div class="container">

<!-- LEFT -->
<div class="panel">

<h3>📊 Resources</h3>

<div class="stat">🧠 Knowledge <span id="k">0</span></div>
<div class="stat">⚡ Energy <span id="e">0</span></div>
<div class="stat">👥 Community <span id="c">0</span></div>

<hr>

<h3>🏗 Build</h3>

<button onclick="build('lab')">📚 Research Lab (-50 🧠)</button>
<button onclick="build('plant')">⚡ Energy Plant (-50 ⚡)</button>
<button onclick="build('hub')">🤝 Community Hub (-50 👥)</button>

<hr>

<button onclick="tick()">▶ NEXT TURN</button>

<div class="log" id="log">Ready...</div>

</div>

<!-- RIGHT -->
<div class="panel">

<h3>🌍 MAP</h3>

<div class="node" onclick="capture(this,'EU')">EU</div>
<div class="node" onclick="capture(this,'US')">US</div>
<div class="node" onclick="capture(this,'ASIA')">ASIA</div>

<hr>

<h3>⭐ ERA</h3>
<div id="era">Individual</div>

<h3>📈 POWER</h3>
<div id="power">0</div>

</div>

</div>

<script>

let k=100,e=100,c=100;

let lab=0,plant=0,hub=0;

let regions={};

function log(msg){
document.getElementById("log").innerText = msg;
}

function build(type){

if(type==="lab" && k>=50){
k-=50; lab++;
log("Built Research Lab");
}

else if(type==="plant" && e>=50){
e-=50; plant++;
log("Built Energy Plant");
}

else if(type==="hub" && c>=50){
c-=50; hub++;
log("Built Community Hub");
}

else{
log("Not enough resources");
}

update();
}

function tick(){

k += lab * 5;
e += plant * 5;
c += hub * 5;

log("Turn processed");

update();
}

function capture(el,node){
regions[node]=true;
el.classList.add("active");
log("Captured " + node);
update();
}

function era(){

let t=k+e+c;

if(t>500) return "Tribe";
if(t>1200) return "Academy";
if(t>2500) return "City";
if(t>5000) return "Global";

return "Individual";
}

function update(){

document.getElementById("k").innerText=Math.floor(k);
document.getElementById("e").innerText=Math.floor(e);
document.getElementById("c").innerText=Math.floor(c);

document.getElementById("era").innerText=era();

document.getElementById("power").innerText=Math.floor(k+e+c);
}

update();

</script>

</body>
</html>
