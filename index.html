<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>MGOT Civilization Steam Core</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#050814;
    color:white;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.card{
    background:#111827;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:10px;
    margin-top:6px;
    border:none;
    border-radius:8px;
    background:#0891b2;
    color:white;
    cursor:pointer;
}

.node{
    padding:8px;
    margin-top:6px;
    background:#0f172a;
    border-radius:8px;
    border:1px solid #1f2937;
    cursor:pointer;
}

.active{border:2px solid #22d3ee;}

.good{color:#34d399;}
.bad{color:#f87171;}
.warn{color:#fbbf24;}
</style>
</head>

<body>

<div class="container">

<h1>🧠 MGOT — STEAM CIVILIZATION CORE</h1>

<div class="grid">

<!-- PLAYER -->
<div>

<div class="card">
<h3>🌍 CIVILIZATION STATUS</h3>

💰 Economy: <span id="e">50</span><br>
🧠 Tech: <span id="t">50</span><br>
⚔ Military: <span id="m">50</span><br>
⚖ Stability: <span id="s">100</span>
</div>

<div class="card">
<h3>🧬 STRATEGY (CHOICE)</h3>

<button onclick="strategy('eco')">💰 Economic Expansion</button>
<button onclick="strategy('tech')">🧠 Tech Focus</button>
<button onclick="strategy('war')">⚔ Military Build</button>
<button onclick="nextTurn()">▶ PROCESS TURN</button>
</div>

<div class="card">
<h3>🌍 MAP CONTROL</h3>

<div class="node" onclick="capture('EU')">EUROPE</div>
<div class="node" onclick="capture('US')">AMERICA</div>
<div class="node" onclick="capture('ASIA')">ASIA</div>

</div>

</div>

<!-- WORLD -->
<div>

<div class="card">
<h3>🤖 AI CIVILIZATION</h3>
AI Power: <span id="ai">80</span>
</div>

<div class="card">
<h3>⚠ WORLD EVENT</h3>
<div id="event" class="warn">System stable...</div>
</div>

<div class="card">
<h3>🏆 STATUS</h3>
<div id="status">Survive and expand</div>
</div>

</div>

</div>

</div>

<script>

let e=50,t=50,m=50,s=100;
let ai=80;

let regions={EU:false,US:false,ASIA:false};

function power(){
return e + t + m + s;
}

function strategy(type){

if(type==='eco'){
e += 12;
s -= 5;
}

if(type==='tech'){
t += 15;
e -= 5;
}

if(type==='war'){
m += 15;
e -= 8;
}

event();
aiTurn();
update();
check();
}

function capture(region){

if(m < 45){
document.getElementById("status").innerHTML =
"<span class='bad'>⚔ Not enough military strength</span>";
return;
}

regions[region]=true;
m -= 10;
ai += 8;

document.getElementById("status").innerHTML =
"<span class='good'>🌍 Captured " + region + "</span>";

update();
}

function aiTurn(){

ai += Math.random()*12;

// AI pressure system
if(ai > power()){
s -= 10;
e -= 6;
m -= 6;

document.getElementById("status").innerHTML =
"<span class='bad'>🤖 AI is outpacing your civilization</span>";
}

if(Math.random() < 0.25){
ai += 10;
}
}

function event(){

let events=[
"💥 Global recession spreading",
"⚠ AI acceleration detected",
"📈 Tech breakthrough available",
"⚔ Border tensions rising",
"🌍 Stability crisis emerging"
];

document.getElementById("event").innerText =
events[Math.floor(Math.random()*events.length)];
}

function nextTurn(){

// passive growth based on territory
if(regions.EU) t += 5;
if(regions.US) e += 5;
if(regions.ASIA) m += 5;

s -= 2; // world pressure

aiTurn();
event();
update();
check();
}

function check(){

if(power() > 350){
document.getElementById("status").innerHTML =
"<span class='good'>🏆 GLOBAL CIVILIZATION DOMINANCE</span>";
}

if(ai > 220){
document.getElementById("status").innerHTML =
"<span class='bad'>💀 AI HAS TAKEN CONTROL</span>";
}

if(s <= 0){
document.getElementById("status").innerHTML =
"<span class='bad'>💀 CIVILIZATION COLLAPSED</span>";
}
}

function update(){

document.getElementById("e").innerText=Math.floor(e);
document.getElementById("t").innerText=Math.floor(t);
document.getElementById("m").innerText=Math.floor(m);
document.getElementById("s").innerText=Math.floor(s);
document.getElementById("ai").innerText=Math.floor(ai);
}

setInterval(event,5000);

update();

</script>

</body>
</html>
