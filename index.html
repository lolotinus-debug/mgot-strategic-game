<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGOT Economy Shop V3</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle,#050816,#020617);
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
background:rgba(255,255,255,0.04);
padding:20px;
border-radius:14px;
}

h1{color:#00d4ff;}

.panel{
background:rgba(0,0,0,0.3);
padding:12px;
border-radius:10px;
margin-bottom:12px;
}

.resources{
display:flex;
justify-content:space-around;
flex-wrap:wrap;
gap:10px;
}

.card{
font-weight:bold;
}

.shop{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
transition:0.2s;
}

button:hover{transform:scale(1.03);}

.blue{background:#00d4ff;color:black;}
.green{background:#22c55e;}
.purple{background:#a855f7;}
.orange{background:#f97316;}
.red{background:#ef4444;}

.log{
margin-top:12px;
height:140px;
overflow:auto;
background:rgba(0,0,0,0.4);
padding:10px;
border-radius:10px;
text-align:left;
font-size:13px;
color:#aaa;
}
</style>
</head>

<body>

<div class="container">

<h1>⚔️ MGOT ECONOMY SHOP V3</h1>
<p>Optimize your system. Every decision has cost.</p>

<div class="panel">
<div class="resources">

<div class="card">🪙 Tokens: <span id="tokens">30</span></div>
<div class="card">⚡ Energy: <span id="energy">20</span></div>
<div class="card">🧠 Knowledge: <span id="knowledge">10</span></div>
<div class="card">🎯 Focus: <span id="focus">5</span></div>

</div>
</div>

<div class="panel shop">

<button class="blue" onclick="buy('energy')">
⚡ Energy Pack<br>5💰 → +10 Energy
</button>

<button class="blue" onclick="buy('knowledge')">
🧠 Knowledge Pack<br>5💰 → +5 Knowledge
</button>

<button class="purple" onclick="buy('focus')">
🎯 Focus Boost<br>10💰 → +3 Focus
</button>

<button class="green" onclick="buy('agent')">
🧍 Deploy Agent<br>10💰 → +1 Agent
</button>

<button class="orange" onclick="buy('system')">
🏗 System Upgrade<br>15💰 → +0.2 Efficiency
</button>

<button class="red" onclick="challenge()">
⚔️ MGOT Challenge<br>Risk vs Reward
</button>

</div>

<div class="panel log" id="log">
MGOT Shop initialized...
</div>

</div>

<script>

// ================= MGOT STATE =================
let game = {
tokens:30,
energy:20,
knowledge:10,
focus:5,
agents:1,
eff:1.0
};

// ================= SHOP SYSTEM =================
function buy(item){

if(item === "energy" && game.tokens >= 5){
game.tokens -= 5;
game.energy += 10;
log("Purchased Energy Pack (-5 tokens)");
}

if(item === "knowledge" && game.tokens >= 5){
game.tokens -= 5;
game.knowledge += 5;
log("Purchased Knowledge Pack (-5 tokens)");
}

if(item === "focus" && game.tokens >= 10){
game.tokens -= 10;
game.focus += 3;
log("Focus Boost applied (-10 tokens)");
}

if(item === "agent" && game.tokens >= 10){
game.tokens -= 10;
game.agents += 1;
game.eff += 0.1;
log("Agent deployed (+efficiency)");
}

if(item === "system" && game.tokens >= 15){
game.tokens -= 15;
game.eff += 0.2;
log("System upgraded (+efficiency)");
}

update();
}

// ================= CHALLENGE SYSTEM =================
function challenge(){

let power = (game.agents * 10) + (game.energy * 0.5) + (game.focus * 2);
let difficulty = 40 + Math.random() * 120;

if(power > difficulty){
game.tokens += 20;
log("Challenge SUCCESS → +20 tokens");
} else {
game.tokens -= 8;
game.energy -= 3;
log("Challenge FAILED → -tokens & energy");
}

update();
}

// ================= AUTO GROWTH =================
setInterval(()=>{

game.tokens += game.agents * 0.2 * game.eff;
game.energy += game.agents * 0.3 * game.eff;
game.knowledge += game.agents * 0.2 * game.eff;

update();

},1000);

// ================= UI =================
function update(){

document.getElementById("tokens").innerText = Math.floor(game.tokens);
document.getElementById("energy").innerText = Math.floor(game.energy);
document.getElementById("knowledge").innerText = Math.floor(game.knowledge);
document.getElementById("focus").innerText = game.focus;

}

// ================= LOG =================
function log(text){
let d=document.getElementById("log");
d.innerHTML += "<br>➤ " + text;
d.scrollTop = d.scrollHeight;
}

update();

</script>

</body>
</html>
