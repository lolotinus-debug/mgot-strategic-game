<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MGOT ONLINE FIX</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#050b1a;
    color:white;
    padding:20px;
}
.container{max-width:800px;margin:auto;}
.card{
    background:#0f172a;
    padding:10px;
    margin-bottom:10px;
    border-radius:10px;
}
button{
    width:100%;
    padding:10px;
    margin-top:5px;
    background:#0891b2;
    border:none;
    color:white;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<h1>🌍 MGOT ONLINE FIX</h1>

<div class="card">
<input id="name" placeholder="Enter name" style="width:100%;padding:10px;">
<button onclick="start()">Start</button>
</div>

<div class="card">
🧠 <span id="k">0</span> |
⚡ <span id="e">0</span> |
👥 <span id="c">0</span>
</div>

<button onclick="act()">🔥 ACT</button>

<div class="card">
<h3>🏆 Leaderboard</h3>
<div id="board"></div>
</div>

</div>

<script type="module">

// 🔥 Firebase MODERN SDK
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  collection,
  onSnapshot,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


// 👉 SEM DÁŠ SVOJ CONFIG
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let user="";
let k=0,e=0,c=0;

// START
window.start = function(){
user = document.getElementById("name").value;
if(!user) return alert("Enter name");
save();
loadBoard();
}

// ACT
window.act = function(){
k+=5;
e+=5;
c+=5;
save();
updateUI();
}

// SAVE PLAYER
async function save(){
if(!user) return;

await setDoc(doc(db,"players",user),{
name:user,
k,
e,
c,
score:k+e+c
});
}

// LEADERBOARD
function loadBoard(){

const q = query(collection(db,"players"),orderBy("score","desc"));

onSnapshot(q,(snap)=>{
let html="";

snap.forEach(d=>{
let data = d.data();
html += `<div>${data.name} — ${data.score}</div>`;
});

document.getElementById("board").innerHTML = html;
});
}

// UI
function updateUI(){
document.getElementById("k").innerText=k;
document.getElementById("e").innerText=e;
document.getElementById("c").innerText=c;
}

setInterval(updateUI,500);

</script>

</body>
</html>
