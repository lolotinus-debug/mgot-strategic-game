<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGOT Fixed</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#020617;
    color:white;
    padding:20px;
}

.container{max-width:900px;margin:auto;}

h1{text-align:center;color:#22d3ee}

.top{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:15px;
}

.box{
    background:#0f172a;
    padding:15px;
    text-align:center;
    border-radius:10px;
}

.era{
    background:#0f172a;
    padding:15px;
    border-radius:10px;
    text-align:center;
    margin-bottom:15px;
}

button{
    background:#0891b2;
    border:none;
    color:white;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    width:100%;
    margin-top:5px;
}

.tree{
    background:#0f172a;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
}

.node{
    background:#111827;
    padding:10px;
    margin-top:10px;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
}

.locked{opacity:0.4}

.progress{
    height:10px;
    background:#1e293b;
    border-radius:10px;
    overflow:hidden;
}

.fill{
    height:100%;
    width:0%;
    background:#22d3ee;
}
</style>
</head>

<body>

<div class="container">

<h1>🧠 MGOT FIXED</h1>

<div class="top">
<div class="box">🧠 <div id="k">0</div></div>
<div class="box">⚡ <div id="e">0</div></div>
<div class="box">👥 <div id="c">0</div></div>
</div>

<div class="era">
⭐ Era: <span id="era">Individual</span>
<br><br>
<div class="progress"><div class="fill" id="bar"></div></div>
</div>

<!-- 🔥 CORE BUTTON (FIX) -->
<button onclick="act()">🔥 TRAIN / ACT (+resources)</button>

<div class="tree">

<div class="node" id="n1">
Discipline I (+Energy/sec)
<button onclick="buy('n1',50,'k')">50 🧠</button>
</div>

<div class="node" id="n2">
Focus I (+Knowledge/sec)
<button onclick="buy('n2',50,'k')">50 🧠</button>
</div>

<div class="node" id="n3">
Social Awareness (+Community/sec)
<button onclick="buy('n3',50,'k')">50 🧠</button>
</div>

<div class="node locked" id="n4">
Communication Skills
<button onclick="buy('n4',120,'c')">120 👥</button>
</div>

</div>

</div>

<script>

let k=0,e=0,c=0;
let era=0;

let nodes={};

function act(){
// CORE LOOP FIX
k+=2;
e+=2;
c+=2;
update();
}

function buy(id,cost,type){

if(type==="k" && k>=cost) k-=cost;
else if(type==="c" && c>=cost) c-=cost;
else return;

nodes[id]=true;
document.getElementById(id).classList.add("active");

unlock(id);
update();
}

function unlock(id){
if(id==="n1") document.getElementById("n4").classList.remove("locked");
}

function total(){return k+e+c;}

function checkEra(){
if(total()>100) era=1;
if(total()>400) era=2;
if(total()>1200) era=3;
if(total()>3000) era=4;
}

function update(){

document.getElementById("k").innerText=Math.floor(k);
document.getElementById("e").innerText=Math.floor(e);
document.getElementById("c").innerText=Math.floor(c);

let eras=["🧍 Individual","👥 Tribe","🏫 Academy","🏙️ City","🌍 Global"];
document.getElementById("era").innerText=eras[era];

document.getElementById("bar").style.width=(total()%100)+"%";

checkEra();
save();
}

function save(){
localStorage.setItem("mgot_fix",JSON.stringify({k,e,c,era,nodes}));
}

function load(){
let d=JSON.parse(localStorage.getItem("mgot_fix"));
if(!d)return;
k=d.k;e=d.e;c=d.c;
era=d.era;
nodes=d.nodes||{};
}

load();
update();

</script>

</body>
</html>
