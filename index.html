<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGOT V5 Visual Tree</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle,#0b1220,#020617);
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:rgba(255,255,255,0.04);
padding:20px;
border-radius:12px;
}

h1{color:#00d4ff;}

.resources{
display:flex;
justify-content:space-around;
margin-bottom:10px;
flex-wrap:wrap;
gap:10px;
}

.actions button{
margin:5px;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.green{background:#22c55e;}
.blue{background:#00d4ff;color:black;}
.orange{background:#f97316;}
.red{background:#ef4444;}

/* ================= TREE ================= */
.tree{
display:flex;
flex-wrap:wrap;
justify-content:center;
align-items:center;
gap:10px;
margin-top:20px;
}

.node{
width:150px;
padding:12px;
border-radius:12px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
user-select:none;
}

.node:hover{
transform:scale(1.05);
}

.locked{
background:#1f2937;
color:#555;
cursor:not-allowed;
}

.available{
background:#00d4ff;
color:black;
}

.unlocked{
background:#22c55e;
color:black;
}

/* lines */
.line{
width:30px;
height:2px;
background:#334155;
}

/* LOG */
.log{
margin-top:15px;
height:120px;
overflow:auto;
background:rgba(0,0,0,0.4);
padding:10px;
border-radius:10px;
text-align:left;
font-size:13px;
color:#aaa;
}
</style>

</head>

<body>

<div class="container">

<h1>🌳⚔️ MGOT V5 VISUAL TREE</h1>

<!-- ================= RESOURCES ================= -->
<div class="resources">
<div>🪙 Tokens: <span id="tokens">10</span></div>
<div>⚡ Energy: <span id="energy">20</span></div>
<div>🧠 Knowledge: <span id="knowledge">10</span></div>
<div>🧍 Workers: <span id="workers">2</span></div>
</div>

<!-- ================= ACTIONS ================= -->
<div class="actions">

<button class="green" onclick="gather()">⚡ Gather (+tokens cost)</button>
<button class="blue" onclick="convertGold()">💰 Convert Gold → Token</button>
<button class="red" onclick="attack()">⚔️ Attack</button>

</div>

<!-- ================= TECH TREE ================= -->
<h2>🌳 TECH TREE</h2>

<div class="tree">

<div id="gathering" class="node locked" onclick="buyNode('gathering')">
🔵 Gathering<br>Cost: 3
</div>

<div class="line"></div>

<div id="workers" class="node locked" onclick="buyNode('workers')">
🧍 Workers<br>Cost: 5
</div>

<div class="line"></div>

<div id="housing" class="node locked" onclick="buyNode('housing')">
🏠 Housing<br>Cost: 6
</div>

<div class="line"></div>

<div id="goldBoost" class="node locked" onclick="buyNode('goldBoost')">
🟢 Gold Boost<br>Cost: 7
</div>

<div class="line"></div>

<div id="tokenMulti" class="node locked" onclick="buyNode('tokenMulti')">
🔴 Token Power<br>Cost: 10
</div>

</div>

<!-- ================= LOG ================= -->
<div class="log" id="log">MGOT V5 initialized...</div>

</div>

<script>

// ================= GAME STATE =================
let game = {
tokens:10,
gold:0,
energy:20,
knowledge:10,
workers:2,
eco:1
};

// ================= UNLOCKS =================
let unlocked = {
gathering:false,
workers:false,
housing:false,
goldBoost:false,
tokenMulti:false
};

// ================= LOG =================
function log(t){
let d=document.getElementById("log");
d.innerHTML+="<br>➤ "+t;
d.scrollTop=d.scrollHeight;
}

// ================= GATHER =================
function gather(){

if(game.tokens < 1){
log("❌ Not enough tokens");
return;
}

game.tokens -= 1;
game.energy += 1;
game.knowledge += 1;

log("⚡ Gathered (-1 token)");
update();
}

// ================= GOLD → TOKEN =================
function convertGold(){

if(game.gold >= 1000){
game.gold -= 1000;
game.tokens += 1;
log("💰 1000 Gold → 1 Token");
update();
}else{
log("❌ Need 1000 gold");
}

}

// ================= ATTACK =================
function attack(){

let enemy = 100 + Math.random()*100;
let power = game.workers*10 + game.energy;

if(power > enemy){
game.gold += 50;
log("⚔️ Victory +50 gold");
}else{
game.tokens -= 1;
log("⚔️ Defeat -1 token");
}

update();
}

// ================= UPGRADE TREE =================
function buyNode(type){

if(type === "gathering" && game.tokens >= 3 && !unlocked.gathering){
game.tokens -= 3;
unlocked.gathering = true;
game.eco += 0.1;
log("🔵 Gathering unlocked");
}

if(type === "workers" && game.tokens >= 5 && unlocked.gathering){
game.tokens -= 5;
unlocked.workers = true;
game.workers += 1;
log("🧍 Workers unlocked");
}

if(type === "housing" && game.tokens >= 6 && unlocked.workers){
game.tokens -= 6;
unlocked.housing = true;
game.eco += 0.2;
log("🏠 Housing unlocked");
}

if(type === "goldBoost" && game.tokens >= 7 && unlocked.housing){
game.tokens -= 7;
unlocked.goldBoost = true;
log("🟢 Gold Boost unlocked");
}

if(type === "tokenMulti" && game.tokens >= 10 && unlocked.goldBoost){
game.tokens -= 10;
unlocked.tokenMulti = true;
log("🔴 Token Power unlocked");
}

updateTree();
update();
}

// ================= TREE UI =================
function updateTree(){

setNode("gathering");
setNode("workers");
setNode("housing");
setNode("goldBoost");
setNode("tokenMulti");

function setNode(id){

let el=document.getElementById(id);

if(unlocked[id]){
el.className="node unlocked";
}
else if(
(id==="gathering") ||
(id==="workers" && unlocked.gathering) ||
(id==="housing" && unlocked.workers) ||
(id==="goldBoost" && unlocked.housing) ||
(id==="tokenMulti" && unlocked.goldBoost)
){
el.className="node available";
}
else{
el.className="node locked";
}

}

}

// ================= UPDATE =================
function update(){

document.getElementById("tokens").innerText = game.tokens;
document.getElementById("energy").innerText = game.energy;
document.getElementById("knowledge").innerText = game.knowledge;
document.getElementById("workers").innerText = game.workers;

}

// INIT
updateTree();
update();

</script>

</body>
</html>
