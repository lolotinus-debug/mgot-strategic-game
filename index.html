<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGOT AoE Style</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#050b1a;
    color:white;
}

.top{
    background:#0b1224;
    padding:10px;
    display:flex;
    justify-content:space-between;
    font-size:13px;
}

.map{
    height:55vh;
    background:radial-gradient(circle,#1a2a55,#050b1a);
    position:relative;
}

.city{
    width:24px;
    height:24px;
    border-radius:50%;
    position:absolute;
    background:#22c55e;
    box-shadow:0 0 10px #22c55e;
    text-align:center;
    line-height:24px;
    font-size:10px;
    cursor:pointer;
}

.panel{
    padding:10px;
}

.card{
    background:#111a33;
    padding:10px;
    margin-bottom:10px;
    border-radius:10px;
}

button{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:none;
    border-radius:8px;
    font-weight:bold;
}

.green{background:#22c55e;color:white;}
.blue{background:#3b82f6;color:white;}
.red{background:#ef4444;color:white;}
</style>
</head>

<body>

<div class="top">
💰 <span id="gold">500</span>
🪵 <span id="wood">500</span>
⚔️ MGOT AoE
</div>

<div class="map">

    <div class="city" id="c0" style="top:40%;left:50%" onclick="select(0)">A</div>
    <div class="city" id="c1" style="top:30%;left:25%" onclick="select(1)">B</div>
    <div class="city" id="c2" style="top:65%;left:70%" onclick="select(2)">C</div>

</div>

<div class="panel">

    <div class="card" id="info"></div>

    <button class="green" onclick="build()">🏗 Build (+wood)</button>
    <button class="blue" onclick="upgrade()">⬆ Upgrade city</button>
    <button class="red" onclick="attack()">⚔ Attack random city</button>

</div>

<script>

let cities=[
{name:"Alpha",gold:200,wood:200,power:1},
{name:"Beta",gold:200,wood:200,power:1},
{name:"Gamma",gold:200,wood:200,power:1}
];

let selected=0;

function select(i){
    selected=i;
    render();
}

function build(){
    let c=cities[selected];
    if(c.gold>=50){
        c.gold-=50;
        c.wood+=80;
    }
    render();
}

function upgrade(){
    let c=cities[selected];
    if(c.wood>=100){
        c.wood-=100;
        c.power++;
    }
    render();
}

function attack(){
    let from=cities[selected];
    let target=Math.floor(Math.random()*3);

    if(target===selected) return;

    let enemy=cities[target];

    let damage=from.power*20;

    enemy.wood-=damage;

    if(enemy.wood<=0){
        enemy.gold=0;
        enemy.power=0;
        enemy.wood=50;
    }

    render();
}

function loop(){

    cities.forEach(c=>{
        c.gold += c.power*10;
        c.wood += c.power*5;
    });

    render();
}

function render(){

    document.getElementById("gold").innerText=Math.floor(cities[selected].gold);
    document.getElementById("wood").innerText=Math.floor(cities[selected].wood);

    document.getElementById("info").innerHTML=
        "<b>"+cities[selected].name+"</b><br>"+
        "Power: "+cities[selected].power+"<br>"+
        "Gold: "+Math.floor(cities[selected].gold)+"<br>"+
        "Wood: "+Math.floor(cities[selected].wood);

    cities.forEach((c,i)=>{
        document.getElementById("c"+i).style.background =
            i===selected ? "#fbbf24" : "#22c55e";
    });
}

setInterval(loop,1500);
render();

</script>

</body>
</html>
