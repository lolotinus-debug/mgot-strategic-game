<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MGOT REAL STRATEGY CORE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
background:#020617;
font-family:Arial;
color:white;
overflow:hidden;
}

canvas{
display:block;
background: radial-gradient(circle,#0f172a,#020617);
}

#ui{
position:absolute;
top:10px;
left:10px;
width:260px;
background:rgba(0,0,0,0.7);
padding:10px;
border-radius:10px;
font-size:13px;
}

button{
width:100%;
margin:4px 0;
padding:6px;
border:none;
border-radius:6px;
cursor:pointer;
color:white;
}

.mine{background:#22c55e;}
.barracks{background:#f97316;}
.wall{background:#64748b;}
.attack{background:#ef4444;}
</style>
</head>

<body>

<div id="ui">
<div>🧠 MGOT Gold: <span id="gold">100</span></div>
<div>🏛 HQ HP: <span id="hp">500</span></div>

<button class="mine" onclick="setBuild('mine')">Build Mine</button>
<button class="barracks" onclick="setBuild('barracks')">Build Barracks</button>
<button class="wall" onclick="setBuild('wall')">Build Wall</button>
<button class="attack" onclick="startAttack()">Attack</button>
</div>

<canvas id="game"></canvas>

<script>
// ================= ENGINE =================
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const GRID=40;

// ================= GAME STATE =================
let gold=100;
let buildMode=null;

let gameState="build"; // build / attack

let playerHQ={x:5,y:5,hp:500};
let enemyHQ={x:14,y:8,hp:500};

let buildings=[
{type:"hq",x:5,y:5,hp:500},
{type:"mine",x:4,y:5,hp:100},
{type:"barracks",x:6,y:5,hp:100}
];

let enemyBuildings=[
{type:"hq",x:14,y:8,hp:500},
{type:"mine",x:13,y:8,hp:100},
{type:"barracks",x:15,y:8,hp:100}
];

let troops=[];

// ================= BUILD SYSTEM =================
function setBuild(type){
buildMode=type;
gameState="build";
}

canvas.addEventListener("click",(e)=>{
const r=canvas.getBoundingClientRect();
const x=Math.floor((e.clientX-r.left)/GRID);
const y=Math.floor((e.clientY-r.top)/GRID);

if(buildMode){
buildings.push({type:buildMode,x,y,hp:100});
}
});

// ================= ATTACK SYSTEM =================
function startAttack(){
gameState="attack";
troops.push({x:5,y:5});
troops.push({x:5,y:5});
}

// ================= ECONOMY =================
function economy(){
buildings.forEach(b=>{
if(b.type==="mine"){
gold+=0.1;
}
});
}

// ================= MOVEMENT =================
function move(a,b){
if(a.x<b.x) a.x++;
if(a.x>b.x) a.x--;
if(a.y<b.y) a.y++;
if(a.y>b.y) a.y--;
}

// ================= COMBAT =================
function combat(){
troops.forEach(t=>{
move(t,enemyHQ);

enemyBuildings.forEach(b=>{
if(Math.abs(t.x-b.x)<1 && Math.abs(t.y-b.y)<1){
b.hp-=3;

if(b.hp<=0){
enemyBuildings.splice(enemyBuildings.indexOf(b),1);
gold+=20;
}
}
});
});

enemyHQ.hp-=0; // placeholder (can expand AI)
}

// ================= AI =================
function ai(){
if(Math.random()<0.01){
enemyBuildings.push({type:"mine",x:13,y:8,hp:100});
}
}

// ================= DRAW =================
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

// grid
ctx.strokeStyle="#1e293b";
for(let x=0;x<canvas.width/GRID;x++){
for(let y=0;y<canvas.height/GRID;y++){
ctx.strokeRect(x*GRID,y*GRID,GRID,GRID);
}
}

// buildings
buildings.forEach(b=>{
ctx.fillStyle=
b.type==="hq"?"#00d4ff":
b.type==="mine"?"#22c55e":
b.type==="barracks"?"#f97316":
"#64748b";

ctx.fillRect(b.x*GRID,b.y*GRID,GRID-2,GRID-2);
});

// enemy
enemyBuildings.forEach(b=>{
ctx.fillStyle="#ef4444";
ctx.fillRect(b.x*GRID,b.y*GRID,GRID-2,GRID-2);
});

// troops
troops.forEach(t=>{
ctx.fillStyle="#ffffff";
ctx.fillRect(t.x*GRID,t.y*GRID,GRID-2,GRID-2);
});
}

// ================= LOOP =================
function loop(){
economy();
ai();

if(gameState==="attack"){
combat();
}

document.getElementById("gold").innerText=Math.floor(gold);
document.getElementById("hp").innerText=playerHQ.hp;

draw();

requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
