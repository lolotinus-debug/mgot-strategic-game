<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>MGOT PRO CORE</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#050b1a;
    color:white;
    padding:20px;
}

h1{text-align:center;color:#22d3ee}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    max-width:1000px;
    margin:auto;
}

.card{
    background:#0f172a;
    padding:15px;
    border-radius:12px;
}

button{
    width:100%;
    padding:10px;
    margin-top:5px;
    background:#0891b2;
    border:none;
    color:white;
    border-radius:8px;
}

.map{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
    margin-top:10px;
}

.node{
    background:#111827;
    padding:10px;
    text-align:center;
    border-radius:8px;
    cursor:pointer;
}

.active{border:2px solid #22d3ee;}
</style>
</head>

<body>

<h1>🧠 MGOT PRO CORE STRATEGY</h1>

<div class="grid">

<div class="card">

<h3>📊 RESOURCES</h3>

🧠 Knowledge: <span id="k">0</span><br>
⚡ Energy: <span id="e">0</span><br>
👥 Community: <span id="c">0</span>

<button onclick="tick()">⚙️ SIMULATE TURN</button>

<hr>

<h3>🏗 BUILD</h3>

<button onclick="build('lab')">📚 Research Lab (+Knowledge)</button>
<button onclick="build('hub')">🤝 Community Hub (+Community)</button>
<button onclick="build('plant')">⚡ Energy Plant (+Energy)</button>

</div>

<div class="card">

<h3>🌍 MAP</h3>

<div class="map">
<div class="node" onclick="capture('EU')">EU</div>
<div class="node" onclick="capture('GLOBAL')">GLOBAL</div>
<div class="node" onclick="capture('ASIA')">ASIA</div>
<div class="node" onclick="capture('US')">US</div>
<div class="node" onclick="capture('CORE')">MGOT CORE</div>
<div class="node" onclick="capture('AFRICA')">AFRICA</div>
</div>

<hr>

<h3>⭐ ERA</h3>
<div id="era">Individual</div>

</div>

</div>

<script>

let k=0,e=0,c=0;

let lab=0,hub=0,plant=0;

let nodes={};

function tick(){

k += lab*2;
e += plant*2;
c += hub*2;

update();
}

function build(type){

if(type==="lab" && k>=50){
k-=50; lab++;
}

if(type==="hub" && c>=50){
c-=50; hub++;
}

if(type==="plant" && e>=50){
e-=50; plant++;
}

update();
}

function capture(node){
nodes[node]=true;
document.querySelectorAll(".node").forEach(n=>{
if(nodes[n.innerText]) n.classList.add("active");
});
update();
}

function update(){

document.getElementById("k").innerText=Math.floor(k);
document.getElementById("e").innerText=Math.floor(e);
document.getElementById("c").innerText=Math.floor(c);

let total = k+e+c;

let era="Individual";
if(total>200) era="Tribe";
if(total>800) era="Academy";
if(total>2000) era="City";
if(total>5000) era="Global Network";

document.getElementById("era").innerText=era;
}

update();

</script>

</body>
</html>
