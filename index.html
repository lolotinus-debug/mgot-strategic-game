<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D RTS Strategická Hra</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #game-container { display: flex; gap: 20px; background: #2a2a2a; padding: 15px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.7); }
        canvas { background: #34495e; border: 4px solid #2c3e50; border-radius: 5px; cursor: crosshair; }
        #ui-panel { width: 250px; display: flex; flex-direction: column; gap: 15px; }
        .resource-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #111; padding: 10px; border-radius: 5px; font-weight: bold; font-size: 15px; }
        .btn { padding: 12px; font-size: 14px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; text-align: left; }
        .btn-gold { background: #f1c40f; color: #000; } .btn-gold:hover { background: #f39c12; }
        .btn-wood { background: #27ae60; } .btn-wood:hover { background: #219a52; }
        .btn-barracks { background: #e74c3c; } .btn-barracks:hover { background: #c0392b; }
        .btn:disabled { background: #555 !important; color: #aaa; cursor: not-allowed; }
        #log { background: #000; padding: 10px; border-radius: 5px; height: 120px; overflow-y: auto; font-size: 12px; color: #00ff00; font-family: monospace; }
        .selected-tool { border: 2px solid #fff; box-shadow: 0 0 10px #fff; }
    </style>
</head>
<body>

<h1>🏰 Moja 2D Real-Time Stratégia</h1>

<div id="game-container">
    <!-- HERNÉ POLE -->
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <!-- OVLÁDACÍ PANEL -->
    <div id="ui-panel">
        <div class="resource-bar">
            <div>🪵 Drevo: <span id="res-wood">150</span></div>
            <div>💰 Zlato: <span id="res-gold">50</span></div>
            <div style="grid-column: span 2; color: #e74c3c;">❤️ Životy základne: <span id="base-hp">100</span></div>
        </div>

        <h3 style="margin: 0; border-bottom: 1px solid #55us; padding-bottom: 5px;">Kúpiť / Postaviť:</h3>
        <button id="build-lumber" class="btn btn-wood" onclick="selectTool('lumberjack')">🪵 Drevorubač (50 Zlato)</button>
        <button id="build-gold" class="btn btn-gold" onclick="selectTool('goldmine')">⛏️ Zlatá Baňa (100 Drevo)</button>
        <button id="build-barracks" class="btn btn-barracks" onclick="selectTool('barracks')">⚔️ Kasárne (150 Drevo)</button>

        <div id="log">> Hra spustená. Kliknite na budovu v menu a potom na zelenú plochu pre jej umiestnenie!</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // STAV HRY
    let resources = { wood: 150, gold: 50 };
    let baseHp = 100;
    let selectedTool = null;
    
    let buildings = [];
    let units = [];
    let enemies = [];
    let spawnTimer = 0;

    // Pridáme hlavnú základňu (Hrad) do stredu
    buildings.push({ x: 280, y: 180, w: 40, h: 40, type: 'castle', color: '#95a5a6' });

    // VÝBER BUDOVY Z MENU
    function selectTool(type) {
        selectedTool = type;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('selected-tool'));
        if(type) document.getElementById(`build-${type === 'lumberjack' ? 'lumber' : type === 'goldmine' ? 'gold' : 'barracks'}`).classList.add('selected-tool');
    }

    // KLIKNUTIE NA MAPU (POSTAVENIE BUDOVY)
    canvas.addEventListener('click', function(e) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        if (!selectedTool) return;

        // Kontrola ceny
        if (selectedTool === 'lumberjack' && resources.gold >= 50) {
            resources.gold -= 50;
            buildings.push({ x: mouseX - 15, y: mouseY - 15, w: 30, h: 30, type: 'lumberjack', color: '#27ae60' });
            spawnUnit(mouseX, mouseY, 'worker_wood');
            logMessage("Postavená chatka drevorubača. Robotník vyrazil!");
        } else if (selectedTool === 'goldmine' && resources.wood >= 100) {
            resources.wood -= 100;
            buildings.push({ x: mouseX - 15, y: mouseY - 15, w: 30, h: 30, type: 'goldmine', color: '#f1c40f' });
            spawnUnit(mouseX, mouseY, 'worker_gold');
            logMessage("Postavená zlatá baňa.");
        } else if (selectedTool === 'barracks' && resources.wood >= 150) {
            resources.wood -= 150;
            buildings.push({ x: mouseX - 20, y: mouseY - 20, w: 40, h: 40, type: 'barracks', color: '#e74c3c' });
            logMessage("Postavené kasárne. Budú automaticky cvičiť vojakov!");
        } else {
            logMessage("Nedostatok surovín!");
        }
        
        selectTool(null); // Zrušiť výber po kliknutí
        updateUI();
    });

    // VYTVORENIE PANÁČIKA
    function spawnUnit(x, y, role) {
        units.push({
            x: x, y: y,
            targetX: x + (Math.random() * 60 - 30),
            targetY: y + (Math.random() * 60 - 30),
            role: role,
            speed: 1,
            timer: 0
        });
    }

    // LOG SPRÁV
    function logMessage(txt) {
        const log = document.getElementById('log');
        log.innerHTML = "> " + txt + "<br>" + log.innerHTML;
    }

    // AKTUALIZÁCIA UI TEXTOV
    function updateUI() {
        document.getElementById('res-wood').innerText = Math.floor(resources.wood);
        document.getElementById('res-gold').innerText = Math.floor(resources.gold);
        document.getElementById('base-hp').innerText = baseHp;
        
        document.getElementById('build-lumber').disabled = resources.gold < 50;
        document.getElementById('build-gold').disabled = resources.wood < 100;
        document.getElementById('build-barracks').disabled = resources.wood < 150;
    }

    // HLAVNÁ HERNÁ SLUČKA (Beží 60-krát za sekundu)
    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Vykreslenie budov
        buildings.forEach(b => {
            ctx.fillStyle = b.color;
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(b.x, b.y, b.w, b.h);
            
            // Logika kasární: Každých 5 sekúnd vyrobia vojaka zadarmo
            if(b.type === 'barracks') {
                b.cooldown = (b.cooldown || 0) + 1;
                if(b.cooldown > 300) {
                    spawnUnit(b.x + 20, b.y + 40, 'soldier');
                    b.cooldown = 0;
                }
            }
        });

        // 2. Pohyb a logika našich panáčikov
        units.forEach(u => {
            // Jednoduchá AI pohybu za cieľom
            let dx = u.targetX - u.x;
            let dy = u.targetY - u.y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            if (dist > 2) {
                u.x += (dx / dist) * u.speed;
                u.y += (dy / dist) * u.speed;
            } else {
                // Keď dorazí na miesto, chvíľu pracuje a získa suroviny
                u.timer++;
                if (u.timer > 60) { 
                    u.timer = 0;
                    if (u.role === 'worker_wood') { resources.wood += 5; updateUI(); }
                    if (u.role === 'worker_gold') { resources.gold += 3; updateUI(); }
                    // Nový náhodný cieľ blízko jeho budovy
                    u.targetX = u.x + (Math.random() * 80 - 40);
                    u.targetY = u.y + (Math.random() * 80 - 40);
                }
            }

            // Vykreslenie panáčika (Zelený = Drevorubač, Žltý = Baník, Modrý = Vojak)
            ctx.fillStyle = u.role === 'soldier' ? '#3498db' : (u.role === 'worker_wood' ? '#2ecc71' : '#f1c40f');
            ctx.beginPath();
            ctx.arc(u.x, u.y, 5, 0, Math.PI * 2);
            ctx.fill();

            // Ak je to vojak, hľadá nepriateľa
            if(u.role === 'soldier') {
                enemies.forEach((e, eIndex) => {
                    let edx = e.x - u.x;
                    let edy = e.y - u.y;
                    let eDist = Math.sqrt(edx*edx + edy*edy);
                    if(eDist < 100) { // Ak je nepriateľ blízko, útočí naňho
                        u.targetX = e.x;
                        u.targetY = e.y;
                        if(eDist < 10) { // Súboj
                            enemies.splice(eIndex, 1); // Zničí nepriateľa
                            logMessage("⚔️ Váš vojak porazil monštrum!");
                        }
                    }
                });
            }
        });

        // 3. Generovanie a útok nepriateľov (červené guličky)
        spawnTimer++;
        if (spawnTimer > 400) { // Každých cca 7 sekúnd vyjde nepriateľ
            enemies.push({ x: Math.random() * canvas.width, y: 0, speed: 0.7 });
            spawnTimer = 0;
            logMessage("⚠️ Z lesa vybehlo divoké monštrum a mieri k hradu!");
        }

        enemies.forEach((e, index) => {
            // Nepriateľ mieri do stredu na hrad (280, 180)
            let hx = 300 - e.x;
            let hy = 200 - e.y;
            let hdist = Math.sqrt(hx*hx + hy*hy);

            if (hdist > 15) {
                e.x += (hx / hdist) * e.speed;
                e.y += (hy / hdist) * e.speed;
            } else {
                // Zaútočil na hrad
                baseHp -= 10;
                enemies.splice(index, 1);
                updateUI();
                logMessage("💥 Hrad bol napadnutý!");
                if(baseHp <= 0) {
                    alert("Koniec hry! Váš hrad bol zničený.");
                    baseHp = 100; buildings = [{ x: 280, y: 180, w: 40, h: 40, type: 'castle', color: '#95a5a6' }]; units = []; enemies = [];
                }
            }
