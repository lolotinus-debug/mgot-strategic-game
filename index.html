<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izometrické Realistické RPG</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #0b0f19; color: #e0e6ed; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #game-layout { display: flex; gap: 20px; background: #141b2d; padding: 20px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.8); border: 2px solid #233044; }
        canvas { background: #1e293b; border: 3px solid #334155; border-radius: 6px; }
        #panel { width: 280px; display: flex; flex-direction: column; gap: 15px; }
        .stat-box { background: #1f2937; padding: 12px; border-radius: 6px; border-left: 5px solid #3b82f6; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: bold; }
        .bar { background: #374151; height: 10px; border-radius: 5px; overflow: hidden; }
        .fill { height: 100%; transition: width 0.3s; }
        #log { background: #020617; padding: 12px; border-radius: 6px; height: 150px; overflow-y: auto; font-size: 13px; color: #38bdf8; border: 1px solid #1e293b; }
        .controls-info { font-size: 12px; color: #94a3b8; background: #0f172a; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

<h1>🌲 Izometrické Survival RPG</h1>

<div id="game-layout">
    <!-- CANVAS PRE HGRU -->
    <canvas id="rtsCanvas" width="700" height="450"></canvas>

    <!-- UI VYSTUPY -->
    <div id="panel">
        <div class="stat-box" style="border-left-color: #ef4444;">
            <div class="stat-row"><span>❤️ Životy:</span><span id="hp-val">100</span></div>
            <div class="bar"><div id="hp-fill" class="fill" style="background: #ef4444; width: 100%;"></div></div>
        </div>
        
        <div class="stat-box" style="border-left-color: #f59e0b;">
            <div class="stat-row"><span>🍖 Hlad:</span><span id="food-val">100</span></div>
            <div class="bar"><div id="food-fill" class="fill" style="background: #f59e0b; width: 100%;"></div></div>
        </div>

        <div class="stat-box" style="border-left-color: #10b981;">
            <div class="stat-row"><span>🪵 Drevo: <span id="inv-wood">0</span></span><span>🪙 Zlato: <span id="inv-gold">0</span></span></div>
            <div class="stat-row" style="margin-top: 5px; font-size: 13px; color: #a855f7;"><span>⏰ Čas: <span id="game-time">12:00</span></span></div>
        </div>

        <div class="controls-info">
            <strong>🎮 Ovládanie:</strong><br>
            • Pohyb: <b>W, A, S, D</b><br>
            • Útok mečom: <b>MEDZERNÍK</b><br>
            • Ťažba / Zber: Automaticky pri objekte
        </div>

        <div id="log">> Prebuďte sa v lese. Nájdite obživu a prežite noc.</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('rtsCanvas');
    const ctx = canvas.getContext('2d');

    // NASTAVENIE SVETA (Izometrická transformácia)
    const TILE_W = 48;
    const TILE_H = 24;
    const MAP_SIZE = 12;

    // HRÁČ
    let player = { isoX: 5, isoY: 5, hp: 100, food: 100, wood: 0, gold: 0, isAttacking: false, attackTimer: 0, dir: 'S' };
    
    // SVET (Objekty na mape: stromy, ložiská, kríky s jedlom)
    let mapObjects = [];
    function spawnObjects() {
        for(let x=0; x<MAP_SIZE; x++){
            for(let y=0; y<MAP_SIZE; y++){
                if((x===5 && y===5) || (x===0 || y===0 || x===MAP_SIZE-1 || y===MAP_SIZE-1)) continue;
                let rand = Math.random();
                if(rand < 0.12) mapObjects.push({x, y, type: 'tree', hp: 3, color: '#15803d'});
                else if(rand < 0.17) mapObjects.push({x, y, type: 'gold', hp: 4, color: '#b45309'});
                else if(rand < 0.22) mapObjects.push({x, y, type: 'bush', hp: 1, color: '#ec4899'}); // Bobule
            }
        }
    }

    // NEPRIESAKAVÉ MONŠTRÁ
    let enemies = [
        { isoX: 10, isoY: 2, hp: 30, state: 'idle', timer: 0 },
        { isoX: 2, isoY: 10, hp: 30, state: 'idle', timer: 0 }
    ];

    // SYSTÉM ČASU A SVETLA
    let globalTime = 720; // Začína na poludní (12:00 = 720 minút)
    let keys = {};

    // PREPOČET SÚRADNÍC NA IZOMETRICKÉ 2.5D
    function toScreen(isoX, isoY) {
        let screenX = (isoX - isoY) * (TILE_W / 2) + canvas.width / 2;
        let screenY = (isoX + isoY) * (TILE_H / 2) + 80;
        return { x: screenX, y: screenY };
    }

    // REGISTRÁCIA KLÁVESNICE
    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    // LOGOVACÍ SYSTÉM
    function pushLog(msg) {
        const log = document.getElementById('log');
        log.innerHTML = "> " + msg + "<br>" + log.innerHTML;
    }

    // LOGIKA REFRESHU A AKCIÍ
    let actionCooldown = 0;
    function updateMechanics() {
        actionCooldown++;
        
        // Zníženie hladu časom
        if(globalTime % 15 === 0 && player.food > 0) {
            player.food = Math.max(0, player.food - 1);
            if(player.food <= 0) player.hp = Math.max(0, player.hp - 2);
            updateUI();
        }

        // Pohyb hráča s kontrolou okrajov mapy
        let nextX = player.isoX;
        let nextY = player.isoY;
        
        if (keys['w'] && actionCooldown > 8) { nextX -= 0.15; nextY -= 0.15; player.dir = 'N'; }
        if (keys['s'] && actionCooldown > 8) { nextX += 0.15; nextY += 0.15; player.dir = 'S'; }
        if (keys['a'] && actionCooldown > 8) { nextX -= 0.15; nextY += 0.15; player.dir = 'W'; }
        if (keys['d'] && actionCooldown > 8) { nextX += 0.15; nextY -= 0.15; player.dir = 'E'; }

        // Kolízia s okrajom
        if(nextX >= 0 && nextX < MAP_SIZE && nextY >= 0 && nextY < MAP_SIZE) {
            player.isoX = nextX;
            player.isoY = nextY;
        }

        // Útok (Medzerník)
        if (keys[' '] && !player.isAttacking) {
            player.isAttacking = true;
            player.attackTimer = 15;
            checkAttackCollision();
        }

        if (player.isAttacking) {
            player.attackTimer--;
            if (player.attackTimer <= 0) player.isAttacking = false;
        }

        // Interakcia s objektmi (stojíte tesne pri nich)
        mapObjects.forEach((obj, idx) => {
            let dist = Math.sqrt(Math.pow(player.isoX - obj.x, 2) + Math.pow(player.isoY - obj.y, 2));
            if(dist < 0.6 && actionCooldown > 20) {
                actionCooldown = 0;
                if(obj.type === 'bush') {
                    player.food = Math.min(100, player.food + 25);
                    pushLog("Zjedli ste lesné bobule. (+25 Hlad)");
                    mapObjects.splice(idx, 1);
                } else if(obj.type === 'tree') {
                    obj.hp--;
                    pushLog("Sekáte do stromu...");
                    if(obj.hp <= 0) { player.wood += 5; mapObjects.splice(idx, 1); pushLog("Získali ste 5x 🪵 Drevo."); }
                } else if(obj.type === 'gold') {
                    obj.hp--;
                    pushLog("Ťažíte zlatú žilu...");
                    if(obj.hp <= 0) { player.gold += 3; mapObjects.splice(idx, 1); pushLog("Získali ste 3x 🪙 Zlato."); }
                }
                updateUI();
            });
        });

        // Logika nepriateľov (Vlci / Monštrá)
        enemies.forEach((en, eIdx) => {
            let distToPlayer = Math.sqrt(Math.pow(player.isoX - en.isoX, 2) + Math.pow(player.isoY - en.isoY, 2));
            
            // Agresia, ak je hráč blízko
            if(distToPlayer < 4) {
                let dx = player.isoX - en.isoX;
                let dy = player.isoY - en.isoY;
                en.isoX += (dx / distToPlayer) * 0.04;
                en.isoY += (dy / distToPlayer) * 0.04;

                //Útok na hráča
                if(distToPlayer < 0.5 && Math.random() < 0.03) {
                    player.hp = Math.max(0, player.hp - 8);
                    pushLog("💥 Vlk vás pohrýzol! (-8 HP)");
                    updateUI();
                    if(player.hp <= 0) {
                        alert("Zomreli ste v divočine!");
                        player.hp = 100; player.food = 100; player.wood = 0; player.gold = 0;
                        updateUI();
                    }
                }
            }
        });

        // Posun času
        globalTime = (globalTime + 0.5) % 1440;
    }

    // KONTROLA ZÁSAHU MEČOM
    function checkAttackCollision() {
        enemies.forEach((en, idx) => {
            let dist = Math.sqrt(Math.pow(player.isoX - en.isoX, 2) + Math.pow(player.isoY - en.isoY, 2));
            if(dist < 1.5) {
                en.hp -= 15;
                pushLog("⚔️ Zásah mečom! Spôsobili ste 15 poškodenie.");
                if(en.hp <= 0) {
                    enemies.splice(idx, 1);
                    player.gold += 10;
                    pushLog("💀 Porazili ste divokého vlka! (+10 Zlato)");
                    updateUI();
                }
            }
        });
    }

    // AKTUALIZÁCIA TEXTOV
    function updateUI() {
        document.getElementById('hp-val').innerText = player.hp;
        document.getElementById('hp-fill').style.width = player.hp + "%";
        document.getElementById('food-val').innerText = player.food;
        document.getElementById('food-fill').style.width = player.food + "%";
        document.getElementById('inv-wood').innerText = player.wood;
        document.getElementById('inv-gold').innerText = player.gold;

        let hours = Math.floor(globalTime / 60).toString().padStart(2, '0');
        let mins = Math.floor(globalTime % 60).toString().padStart(2, '0');
        document.getElementById('game-time').innerText = `${hours}:${mins}`;
    }

    // VYKRESLOVANIE IZOMETRIE GRAFIKY
    function drawGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
