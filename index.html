<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>MGOT ACTIVE STRATEGY</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#050b1a;
    color:white;
}

.header{
    text-align:center;
    padding:15px;
    color:#22d3ee;
}

.container{
    max-width:900px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    padding:15px;
}

.panel{
    background:#111827;
    padding:15px;
    border-radius:12px;
}

button{
    width:100%;
    padding:10px;
    margin-top:8px;
    border:none;
    border-radius:8px;
    background:#0891b2;
    color:white;
    cursor:pointer;
}

.event{
    padding:10px;
    background:#0f172a;
    border-radius:8px;
    margin-top:10px;
    color:#fbbf24;
}

.bad{
    color:#f87171;
}

.good{
    color:#34d399;
}
</style>
</head>

<body>

<div class="header">🧠 MGOT — ACTIVE STRATEGY WORLD</div>

<div class="container">

<!-- LEFT -->
<div class="panel">

<h3>📊 RESOURCES</h3>

🧠 Knowledge: <span id="k">0</span><br>
⚡ Energy: <span id="e">0</span><br>
👥 Community: <span id="c">0</span>

<hr>

<button onclick="nextTurn()">▶ NEXT TURN</button>

<button onclick="choice('knowledge')">📚 Focus Knowledge</button>
<button onclick="choice('energy')">⚡ Focus Energy</button>
<button onclick="choice('community')">🤝 Focus Community</button>

<div id="event" class="event">Waiting for world event...</div>

</div>

<!-- RIGHT -->
<div class="panel">

<h3>🌍 WORLD STATUS</h3>

<div>🔥 Stability: <span id="stability">100</span>%</div>

<div>⭐ Era: <span id="era">Individual</span></div>

<hr>

<h3>⚠️ CONSEQUENCES</h3>

<div id="log">Game started...</div>

</div>

</div>

<script>

let k=50,e=50,c=50;
let stability=100;

let lastChoice="none";

function randEvent(){

let events=[
{
text:"💥 Economic crash hits system",
effect:()=>{e-=10; stability-=10; return "bad"}
},
{
text:"📈 Viral growth in community",
effect:()=>{c+=15; stability+=5; return "good"}
},
{
text:"🧠 Research breakthrough",
effect:()=>{k+=15; return "good"}
},
{
text:"⚡ Energy shortage",
effect:()=>{e-=15; stability-=5; return "bad"}
},
{
text:"🤝 Global alliance formed",
effect:()=>{c+=10; k+=5; return "good"}
}
];

let ev = events[Math.floor(Math.random()*events.length)];

let result = ev.effect();

document.getElementById("event").innerHTML =
result==="good"
? `<span class="good">${ev.text}</span>`
: `<span class="bad">${ev.text}</span>`;

document.getElementById("log").innerText = ev.text;
}

function choice(type){

lastChoice = type;

if(type==="knowledge") k += 10;
if(type==="energy") e += 10;
if(type==="community") c += 10;

stability -= 2;

update();
}

function nextTurn(){

randEvent();

// natural decay
k -= 2;
e -= 2;
c -= 2;

stability -= 1;

// consequences
if(stability < 50){
k -= 5;
e -= 5;
c -= 5;
}

update();
}

function era(){

let t=k+e+c;

if(t>200) return "Tribe";
if(t>500) return "Academy";
if(t>1200) return "City";
if(t>2500) return "Global";

return "Individual";
}

function update(){

document.getElementById("k").innerText=Math.floor(k);
document.getElementById("e").innerText=Math.floor(e);
document.getElementById("c").innerText=Math.floor(c);

document.getElementById("stability").innerText=Math.floor(stability);
document.getElementById("era").innerText=era();

}

update();

</script>

</body>
</html>
