<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGOT Mobile</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#050b1a;
    color:white;
}

.top{
    padding:10px;
    background:#0b1224;
    display:flex;
    justify-content:space-between;
    font-size:14px;
}

.map{
    height:55vh;
    background:radial-gradient(circle,#1a2a55,#050b1a);
    position:relative;
}

.city{
    width:22px;
    height:22px;
    border-radius:50%;
    background:#fbbf24;
    position:absolute;
    box-shadow:0 0 10px #fbbf24;
}

.panel{
    padding:10px;
}

.card{
    background:#111a33;
    padding:10px;
    margin:5px 0;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:none;
    border-radius:8px;
    font-weight:bold;
}

.green{background:#22c55e;color:white;}
.blue{background:#3b82f6;color:white;}
</style>
</head>

<body>

<div class="top">
    💰 <span id="money">500</span>
    👥 <span id="pop">100</span>
    🧠 MGOT <span id="mgot">0</span>
</div>

<div class="map">

    <div class="city" style="top:40%;left:50%" onclick="select(0)"></div>
    <div class="city" style="top:30%;left:25%" onclick="select(1)"></div>
    <div class="city" style="top:65%;left:70%" onclick="select(2)"></div>

</div>

<div class="panel">

    <div class="card" id="info">Select city</div>

    <button class="green" onclick="farm()">Build Farm -100</button>
    <button class="blue" onclick="factory()">Build Factory -150</button>

</div>

<script>

let cities=[
{name:"Capital",money:500,pop:100,farm:1,factory:0,mgot:0},
{name:"North",money:300,pop:80,farm:1,factory:0,mgot:0},
{name:"East",money:400,pop:90,farm:1,factory:0,mgot:0}
];

let selected=0;

function select(i){
    selected=i;
    render();
}

function farm(){
    let c=cities[selected];
    if(c.money>=100){
        c.money-=100;
        c.farm++;
    }
    render();
}

function factory(){
    let c=cities[selected];
    if(c.money>=150){
        c.money-=150;
        c.factory++;
    }
    render();
}

function loop(){

    cities.forEach(c=>{
        c.money += c.factory*5;
        c.pop += c.farm*0.1;

        c.money += c.pop*0.01;

        c.mgot += c.pop/2000;
    });

    render();
}

function render(){

    let c=cities[selected];

    document.getElementById("money").innerText=Math.floor(c.money);
    document.getElementById("pop").innerText=Math.floor(c.pop);
    document.getElementById("mgot").innerText=Math.floor(c.mgot);

    document.getElementById("info").innerHTML=
        "<b>"+c.name+"</b><br>"+
        "Money: "+Math.floor(c.money)+"<br>"+
        "Pop: "+Math.floor(c.pop)+"<br>"+
        "Farms: "+c.farm+"<br>"+
        "Factories: "+c.factory;
}

setInterval(loop,1500);
render();

</script>

</body>
</html>
