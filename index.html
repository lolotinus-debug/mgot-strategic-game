<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MGOT Clash-Style Strategy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    background:#020617;
    font-family:Arial;
    color:white;
    overflow:hidden;
}

canvas {
    display:block;
    background: radial-gradient(circle at center,#0f172a,#020617);
}

#ui {
    position:absolute;
    top:10px;
    left:10px;
    background:rgba(0,0,0,0.6);
    padding:10px;
    border-radius:10px;
}

button {
    margin:3px;
    padding:5px;
    background:#0ea5e9;
    border:none;
    color:white;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="ui">
<div>🧠 MGOT Gold: <span id="gold">100</span></div>
<div>🏰 HQ Level: <span id="hq">1</span></div>
<button onclick="trainTroop()">Train Troop</button>
<button onclick="upgradeHQ()">Upgrade HQ</button>
<button onclick="startRaid()">Start Raid</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const GRID=40;

let gold=100;
let hqLevel=1;
let mode="build"; // build or raid

class Building{
    constructor(x,y,type){
        this.x=x;
        this.y=y;
        this.type=type;
        this.hp=type==="HQ"?300:100;
    }

    draw(){
        ctx.fillStyle=
            this.type==="HQ"?"#00d4ff":
            this.type==="GoldMine"?"#22c55e":
            "#f97316";

        ctx.fillRect(this.x*GRID,this.y*GRID,GRID-2,GRID-2);

        // HP bar
        ctx.fillStyle="red";
        ctx.fillRect(this.x*GRID,this.y*GRID-5,(GRID-2)*(this.hp/300),3);
    }
}

class Troop{
    constructor(x,y){
        this.x=x;
        this.y=y;
        this.hp=50;
        this.target=null;
    }

    move(){
        if(!this.target) return;

        if(this.x<this.target.x) this.x++;
        if(this.x>this.target.x) this.x--;
        if(this.y<this.target.y) this.y++;
        if(this.y>this.target.y) this.y--;
    }

    attack(buildings){
        for(let b of buildings){
            if(Math.abs(b.x-this.x)<1 && Math.abs(b.y-this.y)<1){
                b.hp -= 5;
                if(b.hp<=0){
                    buildings.splice(buildings.indexOf(b),1);
                    gold += 10;
                }
                return;
            }
        }
    }

    update(buildings){
        this.attack(buildings);
        this.move();
    }

    draw(){
        ctx.fillStyle="#ff3b3b";
        ctx.fillRect(this.x*GRID,this.y*GRID,GRID-2,GRID-2);
    }
}

let playerBuildings=[
    new Building(5,5,"HQ"),
    new Building(4,6,"GoldMine"),
    new Building(6,6,"GoldMine")
];

let enemyBuildings=[
    new Building(15,8,"HQ"),
    new Building(14,8,"GoldMine"),
    new Building(16,9,"GoldMine"),
    new Building(15,10,"GoldMine")
];

let troops=[];

function trainTroop(){
    if(gold<10) return;
    gold-=10;
    troops.push(new Troop(5,5));
}

function upgradeHQ(){
    if(gold<50) return;
    gold-=50;
    hqLevel++;
}

function startRaid(){
    mode="raid";

    troops.forEach(t=>{
        t.target={x:15,y:8};
    });
}

// AI defense (simple)
function enemyAI(){
    troops.forEach(t=>{
        if(Math.random()<0.02){
            t.hp -= 1;
        }
    });
}

function update(){
    enemyAI();

    troops.forEach(t=>{
        if(mode==="raid"){
            t.update(enemyBuildings);
        } else {
            t.update(playerBuildings);
        }
    });

    document.getElementById("gold").innerText=Math.floor(gold);
    document.getElementById("hq").innerText=hqLevel;
}

canvas.addEventListener("click",(e)=>{
    const r=canvas.getBoundingClientRect();
    const x=Math.floor((e.clientX-r.left)/GRID);
    const y=Math.floor((e.clientY-r.top)/GRID);

    troops.forEach(t=>{
        t.target={x,y};
    });
});

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    playerBuildings.forEach(b=>b.draw());
    enemyBuildings.forEach(b=>b.draw());

    troops.forEach(t=>t.draw());
}

function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
