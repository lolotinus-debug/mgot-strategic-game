<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MGOT Civilization</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background: radial-gradient(circle at top, #0b1b3a, #020617 70%, #000);
    color:#dbeafe;
}

/* MOBILE FIRST */
.container{
    max-width:100%;
    padding:12px;
}

h1{
    font-size:20px;
    text-align:center;
    color:#38bdf8;
    text-shadow:0 0 10px #38bdf8;
}

.card{
    background:rgba(15,23,42,0.85);
    border:1px solid #1e3a8a;
    box-shadow:0 0 10px rgba(56,189,248,0.2);
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:14px;
    margin-top:6px;
    border:none;
    border-radius:10px;
    background:#0ea5e9;
    color:white;
    font-size:14px;
}

button:active{
    transform:scale(0.98);
}

.node{
    padding:10px;
    margin-top:6px;
    background:#0f172a;
    border:1px solid #1e3a8a;
    border-radius:10px;
    text-align:center;
}

.node:active{
    background:#1e3a8a;
}

.good{color:#34d399;}
.bad{color:#f87171;}
.warn{color:#fbbf24;}
.small{font-size:12px; opacity:0.8;}
</style>
</head>

<body>

<div class="container">

<h1>🧠 MGOT CIVILIZATION</h1>

<div class="card">
🌍 Economy: <span id="e">50</span><br>
🧠 Tech: <span id="t">50</span><br>
⚔ Military: <span id="m">50</span><br>
⚖ Stability: <span id="s">100</span><br>
🤖 AI Power: <span id="ai">80</span>
</div>

<div class="card">
<h3>🎮 STRATEGY OPTIONS</h3>

<button onclick="act('eco')">💰 Invest Economy</button>
<button onclick="act('tech')">🧠 Research Tech</button>
<button onclick="act('mil')">⚔ Build Military</button>
<button onclick="act('stability')">🛡 Stabilize Nation</button>
</div>

<div class="card">
<h3>🌍 MAP CONTROL</h3>

<div class="node" onclick="capture('EU')">EUROPE</div>
<div class="node" onclick="capture('US')">AMERICA</div>
<div class="node" onclick="capture('ASIA')">ASIA</div>
<div class="node" onclick="capture('AFRICA')">AFRICA</div>

<div class="small">Each region gives passive bonuses</div>
</div>

<div class="card">
<h3>⚠ WORLD EVENT</h3>
<div id="event" class="warn">World is unstable...</div>
</div>

<div class="card">
<h3>🏆 STATUS</h3>
<div id="status">Expand your civilization</div>
</div>

</div>

<script>

let e=50,t=50,m=50,s=100;
let ai=80;

let regions={
EU:false,
US:false,
ASIA:false,
AFRICA:false
};

function power(){
return e+t+m+s;
}

function act(type){

if(type==='eco'){
e += 12;
s -= 3;
}

if(type==='tech'){
t += 15;
e -= 5;
}

if(type==='mil'){
m += 15;
e -= 8;
}

if(type==='stability'){
s += 12;
e -= 5;
}

worldEvent();
aiTurn();
update();
check();
}

function capture(r){

if(m < 45){
document.getElementById("status").innerHTML =
"<span class='bad'>⚔ Not enough military power</span>";
return;
}

regions[r]=true;
m -= 10;
ai += 8;

document.getElementById("status").innerHTML =
"<span class='good'>🌍 Captured " + r + "</span>";

update();
}

function aiTurn(){

ai += Math.random()*10;

// AI pressure system
if(ai > power()){
s -= 10;
e -= 6;
m -= 6;

document.getElementById("status").innerHTML =
"<span class='bad'>🤖 AI is surpassing your civilization</span>";
}

// AI expansion
if(Math.random() < 0.25){
ai += 12;
}
}

function worldEvent(){

let events=[
"💥 Global economic instability",
"⚠ AI neural expansion accelerating",
"📈 Scientific breakthrough discovered",
"⚔ Regional conflicts rising",
"🌍 Climate pressure increasing"
];

document.getElementById("event").innerText =
events[Math.floor(Math.random()*events.length)];
}

function check(){

let score = power() + (Object.values(regions).filter(Boolean).length * 30);

if(score > 420){
document.getElementById("status").innerHTML =
"<span class='good'>🏆 GLOBAL DOMINATION ACHIEVED</span>";
}

if(ai > 240){
document.getElementById("status").innerHTML =
"<span class='bad'>💀 AI CONTROLLED THE WORLD</span>";
}

if(s <= 0){
document.getElementById("status").innerHTML =
"<span class='bad'>💀 CIVILIZATION COLLAPSED</span>";
}
}

function update(){

document.getElementById("e").innerText=Math.floor(e);
document.getElementById("t").innerText=Math.floor(t);
document.getElementById("m").innerText=Math.floor(m);
document.getElementById("s").innerText=Math.floor(s);
document.getElementById("ai").innerText=Math.floor(ai);
}

setInterval(worldEvent,4000);

update();

</script>

</body>
</html>
