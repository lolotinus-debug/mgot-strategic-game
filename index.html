<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGOT RTS Map</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#050b1a;
    font-family:Arial;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    z-index:10;
    background:rgba(0,0,0,0.5);
    padding:10px;
    border-radius:10px;
    color:white;
    font-size:13px;
}

button{
    width:120px;
    margin-top:5px;
    padding:8px;
    border:none;
    border-radius:6px;
    font-weight:bold;
}

.green{background:#22c55e;}
.blue{background:#3b82f6;}

canvas{
    display:block;
}
</style>
</head>

<body>

<div id="ui">
<b>MGOT RTS MAP</b><br>

💰 <span id="money">500</span><br>
🌾 <span id="food">0</span><br>

<button class="green" onclick="mode='farm'">Farm</button>
<button class="blue" onclick="mode='factory'">Factory</button>

</div>

<canvas id="c"></canvas>

<script>

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

// CAMERA
let cam={x:0,y:0,zoom:1};

let dragging=false;
let last={x:0,y:0};

// BUILD MODE
let mode="farm";

// RESOURCES
let money=500;
let food=0;

// BUILDINGS
let buildings=[];

// INPUT (drag map)
canvas.addEventListener("mousedown",(e)=>{
    dragging=true;
    last.x=e.clientX;
    last.y=e.clientY;
});

canvas.addEventListener("mouseup",()=>dragging=false);

canvas.addEventListener("mousemove",(e)=>{
    if(dragging){
        cam.x+=(e.clientX-last.x)/cam.zoom;
        cam.y+=(e.clientY-last.y)/cam.zoom;
        last.x=e.clientX;
        last.y=e.clientY;
    }
});

// TOUCH SUPPORT
canvas.addEventListener("touchstart",(e)=>{
    dragging=true;
    last.x=e.touches[0].clientX;
    last.y=e.touches[0].clientY;
});

canvas.addEventListener("touchmove",(e)=>{
    if(dragging){
        cam.x+=(e.touches[0].clientX-last.x)/cam.zoom;
        cam.y+=(e.touches[0].clientY-last.y)/cam.zoom;
        last.x=e.touches[0].clientX;
        last.y=e.touches[0].clientY;
    }
});

canvas.addEventListener("touchend",()=>dragging=false);

// CLICK TO BUILD
canvas.addEventListener("click",(e)=>{

    let x=(e.clientX - canvas.width/2)/cam.zoom - cam.x;
    let y=(e.clientY - canvas.height/2)/cam.zoom - cam.y;

    if(mode==="farm"){
        buildings.push({type:"farm",x,y,t:0});
        money-=50;
    }

    if(mode==="factory"){
        buildings.push({type:"factory",x,y,t:0});
        money-=100;
    }
});

// ZOOM
canvas.addEventListener("wheel",(e)=>{
    cam.zoom*=e.deltaY<0?1.1:0.9;
});

// LOOP
function update(){

    buildings.forEach(b=>{

        b.t++;

        if(b.type==="farm"){
            food+=0.2;
        }

        if(b.type==="factory"){
            money+=0.5;
        }
    });

    document.getElementById("money").innerText=Math.floor(money);
    document.getElementById("food").innerText=Math.floor(food);
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();
    ctx.translate(canvas.width/2,canvas.height/2);
    ctx.scale(cam.zoom,cam.zoom);
    ctx.translate(-cam.x,-cam.y);

    // GRID MAP (world)
    drawGrid();

    // BUILDINGS
    buildings.forEach(b=>{

        ctx.fillStyle = b.type==="farm" ? "#22c55e" : "#3b82f6";

        ctx.fillRect(b.x-10,b.y-10,20,20);

        ctx.fillStyle="white";
        ctx.font="10px Arial";
        ctx.fillText(b.type,b.x-15,b.y-15);
    });

    ctx.restore();

    requestAnimationFrame(draw);
}

function drawGrid(){

    ctx.strokeStyle="rgba(255,255,255,0.05)";

    let s=100;

    for(let x=-2000;x<2000;x+=s){
        ctx.beginPath();
        ctx.moveTo(x,-2000);
        ctx.lineTo(x,2000);
        ctx.stroke();
    }

    for(let y=-2000;y<2000;y+=s){
        ctx.beginPath();
        ctx.moveTo(-2000,y);
        ctx.lineTo(2000,y);
        ctx.stroke();
    }
}

setInterval(update,1000);
draw();

</script>

</body>
</html>
