<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGOT V5 FIX</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle,#0b1220,#020617);
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:rgba(255,255,255,0.04);
padding:20px;
border-radius:12px;
}

h1{color:#00d4ff;}

.resources{
display:flex;
justify-content:space-around;
gap:10px;
flex-wrap:wrap;
margin-bottom:10px;
}

button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
margin:5px;
}

.green{background:#22c55e;}
.blue{background:#00d4ff;color:black;}
.red{background:#ef4444;}

.tree{
display:flex;
flex-wrap:wrap;
justify-content:center;
align-items:center;
gap:10px;
margin-top:20px;
}

.node{
width:150px;
padding:12px;
border-radius:12px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

.node:hover{transform:scale(1.05);}

.locked{
background:#1f2937;
color:#666;
cursor:not-allowed;
}

.available{
background:#00d4ff;
color:black;
}

.unlocked{
background:#22c55e;
color:black;
}

.line{
width:30px;
height:2px;
background:#334155;
}

.log{
margin-top:15px;
height:120px;
overflow:auto;
background:rgba(0,0,0,0.4);
padding:10px;
border-radius:10px;
text-align:left;
font-size:13px;
color:#aaa;
}
</style>
</head>

<body>

<div class="container">

<h1>🌳 MGOT V5 FIXED TREE</h1>

<div class="resources">
<div>🪙 Tokens: <span id="tokens">10</span></div>
<div>⚡ Energy: <span id="energy">20</span></div>
<div>🧍 Workers: <span id="workers">1</span></div>
<div>💰 Gold: <span id="gold">0</span></div>
</div>

<button class="green" onclick="gather()">⚡ Gather</button>
<button class="blue" onclick="convert()">💰 1000 Gold → 1 Token</button>
<button class="red" onclick="attack()">⚔️ Attack</button>

<h2>🌳 TECH TREE</h2>

<div class="tree">

<div id="gathering" class="node locked" onclick="buy('gathering')">
🔵 Gathering<br>Cost: 3
</div>

<div class="line"></div>

<div id="workers" class="node locked" onclick="buy('workers')">
🧍 Workers<br>Cost: 5
</div>

<div class="line"></div>

<div id="housing" class="node locked" onclick="buy('housing')">
🏠 Housing<br>Cost: 6
</div>

<div class="line"></div>

<div id="goldBoost" class="node locked" onclick="buy('goldBoost')">
🟢 Gold Boost<br>Cost: 7
</div>

<div class="line"></div>

<div id="tokenMulti" class="node locked" onclick="buy('tokenMulti')">
🔴 Token Power<br>Cost: 10
</div>

</div>

<div class="log" id="log"></div>

</div>

<script>

// ================= STATE =================
let game = {
tokens:10,
gold:0,
energy:20,
workers:1,
eco:1
};

let unlocked = {
gathering:false,
workers:false,
housing:false,
goldBoost:false,
tokenMulti:false
};

// ================= LOG =================
function log(t){
let d=document.getElementById("log");
d.innerHTML+="<br>➤ "+t;
d.scrollTop=d.scrollHeight;
}

// ================= GATHER =================
function gather(){
game.tokens += 0; // no exploit base
game.energy += 1;
game.gold += game.workers * 2;
log("⚡ Gathered");
update();
}

// ================= CONVERT =================
function convert(){
if(game.gold >= 1000){
game.gold -= 1000;
game.tokens += 1;
log("💰 1000 Gold → 1 Token");
}else{
log("❌ Not enough gold");
}
update();
}

// ================= ATTACK =================
function attack(){
let enemy = 80 + Math.random()*120;
let power = game.workers*10 + game.energy;

if(power > enemy){
game.gold += 50;
log("⚔️ Victory +50 gold");
}else{
game.tokens -= 1;
log("⚔️ Defeat -1 token");
}
update();
}

// ================= TREE =================
function buy(type){

if(type==="gathering" && game.tokens>=3 && !unlocked.gathering){
game.tokens-=3;
unlocked.gathering=true;
game.eco+=0.1;
log("🔵 Gathering unlocked");
}

if(type==="workers" && game.tokens>=5 && unlocked.gathering){
game.tokens-=5;
unlocked.workers=true;
game.workers+=1;
log("🧍 Workers unlocked");
}

if(type==="housing" && game.tokens>=6 && unlocked.workers){
game.tokens-=6;
unlocked.housing=true;
log("🏠 Housing unlocked");
}

if(type==="goldBoost" && game.tokens>=7 && unlocked.housing){
game.tokens-=7;
unlocked.goldBoost=true;
log("🟢 Gold Boost unlocked");
}

if(type==="tokenMulti" && game.tokens>=10 && unlocked.goldBoost){
game.tokens-=10;
unlocked.tokenMulti=true;
log("🔴 Token Power unlocked");
}

updateTree();
update();
}

// ================= TREE UI FIX =================
function updateTree(){

function set(id,can,unlockedFlag){

let el=document.getElementById(id);

if(unlockedFlag){
el.className="node unlocked";
}
else if(can){
el.className="node available";
}
else{
el.className="node locked";
}
}

set("gathering",true,unlocked.gathering);
set("workers",unlocked.gathering,unlocked.workers);
set("housing",unlocked.workers,unlocked.housing);
set("goldBoost",unlocked.housing,unlocked.goldBoost);
set("tokenMulti",unlocked.goldBoost,unlocked.tokenMulti);

}

// ================= UPDATE =================
function update(){
document.getElementById("tokens").innerText=game.tokens;
document.getElementById("energy").innerText=game.energy;
document.getElementById("workers").innerText=game.workers;
document.getElementById("gold").innerText=game.gold;
}

// INIT
updateTree();
update();

</script>

</body>
</html>
