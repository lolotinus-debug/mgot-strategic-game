<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGOT Strategy - Playable</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#050b1a;
    color:white;
    overflow:hidden;
}

.topbar{
    height:60px;
    background:#0b1224;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    border-bottom:1px solid #24314f;
}

.resources{
    display:flex;
    gap:10px;
    font-size:14px;
}

.container{
    display:flex;
    height:calc(100vh - 60px);
}

.map{
    flex:1;
    position:relative;
    background:radial-gradient(circle, #1a2a55, #050b1a);
}

.city{
    width:14px;
    height:14px;
    background:#fbbf24;
    border-radius:50%;
    position:absolute;
    cursor:pointer;
    box-shadow:0 0 10px #fbbf24;
}

.panel{
    width:320px;
    background:#0b1224;
    border-left:1px solid #24314f;
    padding:10px;
    overflow:auto;
}

button{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.build{background:#22c55e;color:white;}
.upg{background:#3b82f6;color:white;}
.danger{background:#ef4444;color:white;}

.log{
    font-size:12px;
    color:#94a3b8;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="topbar">
    <div><b>MGOT STRATEGY</b></div>

    <div class="resources">
        💰 <span id="money">1000</span>
        👥 <span id="pop">100</span>
        🌾 <span id="food">100</span>
        ⚡ <span id="energy">100</span>
        🧠 <span id="mgot">0</span>
    </div>
</div>

<div class="container">

    <!-- MAP -->
    <div class="map">

        <div class="city" style="top:40%;left:50%" onclick="selectCity('Capital')"></div>
        <div class="city" style="top:30%;left:30%" onclick="selectCity('North')"></div>
        <div class="city" style="top:60%;left:70%" onclick="selectCity('East')"></div>

    </div>

    <!-- PANEL -->
    <div class="panel">

        <h3 id="cityName">City: Capital</h3>

        <div>Stability: <span id="stab">100</span>%</div>

        <hr>

        <button class="build" onclick="build('farm')">Build Farm (100$)</button>
        <button class="build" onclick="build('factory')">Build Factory (200$)</button>
        <button class="upg" onclick="upgrade()">Upgrade City (150$)</button>

        <hr>

        <div><b>Buildings</b></div>
        <div id="buildings"></div>

        <hr>

        <div><b>Events</b></div>
        <div id="events"></div>

        <hr>

        <div class="log" id="log"></div>

    </div>

</div>

<script>

let state = {
    money:1000,
    pop:100,
    food:100,
    energy:100,
    mgot:0,
    stab:100,
    city:"Capital",
    buildings:[]
};

// CITY SELECT
function selectCity(name){
    state.city = name;
    document.getElementById("cityName").innerText = "City: " + name;
    log("Switched to " + name);
}

// BUILD SYSTEM
function build(type){

    if(type=="farm" && state.money>=100){
        state.money-=100;
        state.food+=50;
        state.buildings.push("Farm");
        log("Farm built");
    }

    if(type=="factory" && state.money>=200){
        state.money-=200;
        state.money+=50;
        state.energy-=10;
        state.buildings.push("Factory");
        log("Factory built");
    }

    render();
}

// UPGRADE
function upgrade(){
    if(state.money>=150){
        state.money-=150;
        state.stab+=5;
        state.mgot+=5;
        log("City upgraded");
    }
    render();
}

// ECONOMY LOOP
function gameLoop(){

    state.money += state.pop * 0.1;
    state.food -= state.pop * 0.05;

    if(state.food<0){
        state.stab -= 1;
    }

    if(state.stab<=0){
        alert("Game Over - collapse!");
        location.reload();
    }

    state.mgot += 0.2;

    randomEvent();

    render();
}

// EVENTS
function randomEvent(){
    if(Math.random()<0.03){

        let events = [
            "Economic boom +200$",
            "Drought -50 food",
            "Migration +20 pop",
            "Energy crisis -20 energy"
        ];

        let e = events[Math.floor(Math.random()*events.length)];

        if(e.includes("200")){
            state.money+=200;
        }
        if(e.includes("food")){
            state.food-=50;
        }
        if(e.includes("pop")){
            state.pop+=20;
        }
        if(e.includes("energy")){
            state.energy-=20;
        }

        log("EVENT: " + e);
    }
}

// LOG
function log(text){
    let div = document.getElementById("log");
    div.innerHTML = text + "<br>" + div.innerHTML;
}

// RENDER
function render(){
    document.getElementById("money").innerText = Math.floor(state.money);
    document.getElementById("pop").innerText = state.pop;
    document.getElementById("food").innerText = Math.floor(state.food);
    document.getElementById("energy").innerText = state.energy;
    document.getElementById("mgot").innerText = Math.floor(state.mgot);
    document.getElementById("stab").innerText = state.stab;

    let b = document.getElementById("buildings");
    b.innerHTML = state.buildings.map(x=>"• "+x).join("<br>");
}

// LOOP START
setInterval(gameLoop, 2000);
render();

</script>

</body>
</html>
