<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>MGOT Civilization Neon</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background: radial-gradient(circle at top, #0b1b3a, #020617 60%, #000);
    color:#dbeafe;
}

/* neon glow */
h1,h3{
    color:#38bdf8;
    text-shadow:0 0 10px #38bdf8;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.card{
    background:rgba(15,23,42,0.85);
    border:1px solid #1e3a8a;
    box-shadow:0 0 15px rgba(56,189,248,0.2);
    padding:15px;
    border-radius:12px;
}

button{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:none;
    border-radius:8px;
    background:#0ea5e9;
    color:white;
    cursor:pointer;
    transition:0.2s;
    box-shadow:0 0 10px rgba(14,165,233,0.4);
}

button:hover{
    background:#38bdf8;
    box-shadow:0 0 20px rgba(56,189,248,0.6);
}

.node{
    padding:8px;
    margin-top:6px;
    background:#0f172a;
    border:1px solid #1e3a8a;
    border-radius:8px;
    cursor:pointer;
}

.node:hover{
    box-shadow:0 0 10px #38bdf8;
}

.good{color:#34d399;}
.bad{color:#f87171;}
.warn{color:#fbbf24;}
</style>
</head>

<body>

<div class="container">

<h1>🧠 MGOT CIVILIZATION — NEON CORE</h1>

<div class="grid">

<!-- PLAYER -->
<div>

<div class="card">
<h3>🌍 CIVILIZATION CORE</h3>

💰 Economy: <span id="e">50</span><br>
🧠 Tech: <span id="t">50</span><br>
⚔ Military: <span id="m">50</span><br>
⚖ Stability: <span id="s">100</span>
</div>

<div class="card">
<h3>🧬 STRATEGY</h3>

<button onclick="strategy('eco')">💰 Economic Growth</button>
<button onclick="strategy('tech')">🧠 Tech Expansion</button>
<button onclick="strategy('war')">⚔ Military Power</button>

<button onclick="nextTurn()">▶ NEXT TURN</button>
</div>

<div class="card">
<h3>🌍 MAP CONTROL</h3>

<div class="node" onclick="capture('EU')">EUROPE</div>
<div class="node" onclick="capture('US')">AMERICA</div>
<div class="node" onclick="capture('ASIA')">ASIA</div>

</div>

</div>

<!-- WORLD -->
<div>

<div class="card">
<h3>🤖 AI CIVILIZATION</h3>
AI Power: <span id="ai">80</span>
</div>

<div class="card">
<h3>⚠ WORLD EVENT</h3>
<div id="event" class="warn">Neon world is stabilizing...</div>
</div>

<div class="card">
<h3>🏆 STATUS</h3>
<div id="status">Build your empire</div>
</div>

</div>

</div>

</div>

<script>

let e=50,t=50,m=50,s=100;
let ai=80;

let regions={EU:false,US:false,ASIA:false};

function power(){
return e+t+m+s;
}

function strategy(type){

if(type==='eco'){
e += 12;
s -= 4;
}

if(type==='tech'){
t += 15;
e -= 5;
}

if(type==='war'){
m += 15;
e -= 8;
}

worldEvent();
aiTurn();
update();
check();
}

function capture(r){

if(m < 45){
document.getElementById("status").innerHTML =
"<span class='bad'>⚔ Insufficient military power</span>";
return;
}

regions[r]=true;
m -= 10;
ai += 8;

document.getElementById("status").innerHTML =
"<span class='good'>🌍 Region captured: " + r + "</span>";

update();
}

function aiTurn(){

ai += Math.random()*12;

if(ai > power()){
s -= 10;
e -= 6;
m -= 6;

document.getElementById("status").innerHTML =
"<span class='bad'>🤖 AI is surpassing your civilization</span>";
}

if(Math.random() < 0.2){
ai += 10;
}
}

function worldEvent(){

let events=[
"💥 Neon economic fluctuation detected",
"⚠ AI neural expansion growing",
"📈 Quantum research breakthrough",
"⚔ Global tension rising",
"🌍 System stability weakening"
];

document.getElementById("event").innerText =
events[Math.floor(Math.random()*events.length)];
}

function nextTurn(){

if(regions.EU) t += 5;
if(regions.US) e += 5;
if(regions.ASIA) m += 5;

s -= 2;

aiTurn();
worldEvent();
update();
check();
}

function check(){

if(power() > 380){
document.getElementById("status").innerHTML =
"<span class='good'>🏆 NEON GLOBAL DOMINATION ACHIEVED</span>";
}

if(ai > 230){
document.getElementById("status").innerHTML =
"<span class='bad'>💀 AI CONTROLLED THE NEON WORLD</span>";
}

if(s <= 0){
document.getElementById("status").innerHTML =
"<span class='bad'>💀 CIVILIZATION COLLAPSED</span>";
}
}

function update(){

document.getElementById("e").innerText=Math.floor(e);
document.getElementById("t").innerText=Math.floor(t);
document.getElementById("m").innerText=Math.floor(m);
document.getElementById("s").innerText=Math.floor(s);
document.getElementById("ai").innerText=Math.floor(ai);
}

setInterval(worldEvent,4500);

update();

</script>

</body>
</html>
