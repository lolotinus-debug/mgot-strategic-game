<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MGOT Final Strategy</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
font-family:Arial,sans-serif;
background:#020617;
color:white;
}

/* TOP BAR */

#topbar{
position:fixed;
top:0;
left:0;
width:100%;
height:60px;
background:#0f172a;
display:flex;
align-items:center;
justify-content:center;
gap:25px;
z-index:999;
border-bottom:2px solid #00d4ff;
}

.resource{
font-weight:bold;
color:#00d4ff;
}

/* UI */

#ui{
position:fixed;
right:15px;
top:80px;
width:260px;
background:rgba(15,23,42,.95);
border:1px solid #00d4ff;
padding:15px;
border-radius:10px;
z-index:999;
}

#ui h2{
margin-bottom:10px;
color:#00d4ff;
}

button{
width:100%;
padding:10px;
margin-bottom:8px;
border:none;
cursor:pointer;
font-weight:bold;
border-radius:6px;
background:#00d4ff;
color:black;
}

button:hover{
opacity:.9;
}

/* LOG */

#log{
position:fixed;
left:10px;
bottom:10px;
width:350px;
height:180px;
overflow:auto;
background:rgba(0,0,0,.8);
padding:10px;
border-radius:8px;
font-size:13px;
}

#log div{
margin-bottom:4px;
}

/* MAP */

canvas{
display:block;
}

</style>
</head>
<body>

<div id="topbar">

<div class="resource">💰 Gold: <span id="gold">500</span></div>

<div class="resource">⚡ Energy: <span id="energy">100</span></div>

<div class="resource">🧠 Knowledge: <span id="knowledge">0</span></div>

<div class="resource">💠 MGOT: <span id="token">5</span></div>

<div class="resource">👷 Workers: <span id="workers">3</span></div>

</div>

<div id="ui">

<h2>🏙 MGOT City</h2>

<button onclick="build('house')">
🏠 Build House
</button>

<button onclick="build('mine')">
⛏ Build Mine
</button>

<button onclick="build('lab')">
🧠 Build Lab
</button>

<button onclick="build('plant')">
⚡ Build Energy Plant
</button>

</div>

<div id="log"></div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const TILE=64;

let cameraX=0;
let cameraY=0;

let game={

gold:500,
energy:100,
knowledge:0,
token:5,
workers:3

};

let buildings=[];
canvas.addEventListener("click",(e)=>{

if(!selectedBuild) return;

const rect = canvas.getBoundingClientRect();

const mx = e.clientX - rect.left;
const my = e.clientY - rect.top;

const tileX = Math.floor((mx + cameraX)/TILE);
const tileY = Math.floor((my + cameraY)/TILE);

let cost = 0;

if(selectedBuild==="house") cost=100;
if(selectedBuild==="mine") cost=150;
if(selectedBuild==="lab") cost=200;
if(selectedBuild==="plant") cost=200;

if(game.gold < cost){

log("❌ Not enough gold");

return;
}

game.gold -= cost;

buildings.push({

x:tileX,
y:tileY,
type:selectedBuild,
level:1

});

selectedBuild = null;

updateUI();

log("✅ Building placed");

});
  
/* MAP */

const MAP_W=60;
const MAP_H=60;

/* LOG */

function log(text){

let div=document.createElement("div");

div.innerText=text;

document.getElementById("log").prepend(div);

}

/* BUILD */

let selectedBuild = null;

function build(type){

selectedBuild = type;

log("🏗 Placement mode: " + type);

}
}

game.gold-=cost;

buildings.push({

x:Math.floor(Math.random()*20)+5,
y:Math.floor(Math.random()*20)+5,
type:type,
level:1

});

log("✅ "+type+" constructed");

updateUI();

}

/* UPDATE */

function updateUI(){

gold.innerText=Math.floor(game.gold);
energy.innerText=Math.floor(game.energy);
knowledge.innerText=Math.floor(game.knowledge);
token.innerText=Math.floor(game.token);
workers.innerText=Math.floor(game.workers);

}

/* ECONOMY */

setInterval(()=>{

buildings.forEach(b=>{

if(b.type==="mine")
game.gold+=2*b.level;

if(b.type==="lab")
game.knowledge+=1*b.level;

if(b.type==="plant")
game.energy+=2*b.level;

});

updateUI();

},1000);

/* CAMERA */

window.addEventListener("keydown",(e)=>{

if(e.key==="ArrowLeft")
cameraX-=20;

if(e.key==="ArrowRight")
cameraX+=20;

if(e.key==="ArrowUp")
cameraY-=20;

if(e.key==="ArrowDown")
cameraY+=20;

});

/* DRAW */

function drawMap(){

ctx.fillStyle="#07131f";

ctx.fillRect(0,0,canvas.width,canvas.height);

for(let x=0;x<MAP_W;x++){

for(let y=0;y<MAP_H;y++){

ctx.strokeStyle="#10263d";

ctx.strokeRect(

x*TILE-cameraX,
y*TILE-cameraY,
TILE,
TILE

);

}

}

}

/* BUILDINGS */

function drawBuildings(){

buildings.forEach(b=>{

let x=b.x*TILE-cameraX;
let y=b.y*TILE-cameraY;

if(b.type==="house")
ctx.fillStyle="#22c55e";

if(b.type==="mine")
ctx.fillStyle="#f59e0b";

if(b.type==="lab")
ctx.fillStyle="#a855f7";

if(b.type==="plant")
ctx.fillStyle="#00d4ff";

ctx.fillRect(
x+8,
y+8,
48,
48
);

ctx.fillStyle="white";
ctx.fillText(
"Lv"+b.level,
x+12,
y+22
);

});

}

/* LOOP */

function loop(){

drawMap();

drawBuildings();

requestAnimationFrame(loop);

}

updateUI();

loop();

</script>

</body>
</html>
