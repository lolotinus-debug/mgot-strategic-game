<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>MGOT Strategy</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1020;
    color:white;
}

.header{
    text-align:center;
    padding:15px;
    font-size:20px;
    color:#22d3ee;
}

.wrap{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    max-width:1100px;
    margin:auto;
    padding:15px;
}

.panel{
    background:#111827;
    padding:15px;
    border-radius:12px;
    border:1px solid #1f2937;
}

.stat{
    display:flex;
    justify-content:space-between;
    margin:5px 0;
}

button{
    width:100%;
    padding:10px;
    margin-top:6px;
    background:#0891b2;
    border:none;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

button:hover{opacity:0.9}

.map{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-top:10px;
}

.node{
    background:#0f172a;
    padding:10px;
    text-align:center;
    border-radius:8px;
    cursor:pointer;
    border:1px solid #1f2937;
}

.active{
    border:2px solid #22d3ee;
}

.small{
    font-size:12px;
    color:#94a3b8;
}
</style>
</head>

<body>

<div class="header">
🧠 MGOT — STEAM STRATEGY CORE
</div>

<div class="wrap">

<!-- LEFT -->
<div class="panel">

<h3>📊 Resources</h3>

<div class="stat">🧠 Knowledge <span id="k">0</span></div>
<div class="stat">⚡ Energy <span id="e">0</span></div>
<div class="stat">👥 Community <span id="c">0</span></div>

<hr>

<h3>🏗 Build</h3>

<div class="small">Každá budova generuje pasívny rast</div>

<button onclick="build('lab')">📚 Research Lab (+Knowledge)</button>
<button onclick="build('plant')">⚡ Energy Plant (+Energy)</button>
<button onclick="build('hub')">🤝 Community Hub (+Community)</button>

<hr>

<h3>⚙️ Economy Tick</h3>
<button onclick="tick()">▶ Advance Turn</button>

</div>

<!-- RIGHT -->
<div class="panel">

<h3>🌍 MAP CONTROL</h3>

<div class="small">Obsadené regióny dávajú bonus</div>

<div class="map">
<div class="node" onclick="capture(this,'EU')">EU</div>
<div class="node" onclick="capture(this,'US')">US</div>
<div class="node" onclick="capture(this,'ASIA')">ASIA</div>
<div class="node" onclick="capture(this,'AFRICA')">AFRICA</div>
<div class="node" onclick="capture(this,'GLOBAL')">GLOBAL</div>
<div class="node" onclick="capture(this,'CORE')">CORE</div>
</div>

<hr>

<h3>⭐ ERA</h3>
<div id="era">Individual</div>

<h3>📈 Power</h3>
<div id="power">0</div>

</div>

</div>

<script>

let k=0,e=0,c=0;

let lab=0,plant=0,hub=0;

let regions={};

function build(type){

if(type==="lab" && k>=50){k-=50; lab++;}
if(type==="plant" && e>=50){e-=50; plant++;}
if(type==="hub" && c>=50){c-=50; hub++;}

update();
}

function tick(){

// passive economy
k += lab * 2;
e += plant * 2;
c += hub * 2;

// region bonuses
if(regions.EU) k += 2;
if(regions.US) e += 2;
if(regions.ASIA) c += 2;
if(regions.GLOBAL) k += e += c += 1;

update();
}

function capture(el,node){

regions[node]=true;
el.classList.add("active");
update();
}

function eraCalc(){

let t = k+e+c;

if(t>200) return "Tribe";
if(t>800) return "Academy";
if(t>2000) return "City";
if(t>5000) return "Global Network";

return "Individual";
}

function update(){

document.getElementById("k").innerText=Math.floor(k);
document.getElementById("e").innerText=Math.floor(e);
document.getElementById("c").innerText=Math.floor(c);

document.getElementById("era").innerText=eraCalc();

document.getElementById("power").innerText=Math.floor(k+e+c);
}

update();

</script>

</body>
</html>
