<!DOCTYPE html>
<html lang="sk">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MGOT Final Strategy</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#020617;
font-family:Arial,sans-serif;
overflow:hidden;
color:white;
}

#topbar{
position:fixed;
top:0;
left:0;
width:100%;
height:60px;
background:#0f172a;
display:flex;
align-items:center;
justify-content:center;
gap:20px;
border-bottom:2px solid #00d4ff;
z-index:100;
}

.resource{
font-weight:bold;
color:#00d4ff;
}

#leftPanel{
position:fixed;
left:10px;
top:80px;
width:240px;
background:#0f172a;
padding:15px;
border-radius:10px;
}

#leftPanel h2{
margin-bottom:10px;
color:#00d4ff;
}

#leftPanel button{
width:100%;
margin-bottom:8px;
padding:10px;
border:none;
cursor:pointer;
background:#00d4ff;
color:black;
font-weight:bold;
border-radius:6px;
}

#rightPanel{
position:fixed;
right:10px;
top:80px;
width:260px;
background:#0f172a;
padding:15px;
border-radius:10px;
}

#log{
position:fixed;
bottom:10px;
left:10px;
width:400px;
height:180px;
overflow:auto;
background:#000;
padding:10px;
border-radius:10px;
font-size:12px;
}

canvas{
display:block;
}

</style>

</head>

<body>

<div id="topbar">

<div class="resource">
💰 Gold:
<span id="gold">500</span>
</div>

<div class="resource">
⚡ Energy:
<span id="energy">100</span>
</div>

<div class="resource">
🧠 Knowledge:
<span id="knowledge">0</span>
</div>

<div class="resource">
💠 MGOT:
<span id="token">5</span>
</div>

<div class="resource">
👷 Workers:
<span id="workers">3</span>
</div>

<div class="resource">
👥 Population:
<span id="population">3</span>
</div>

</div>

<div id="leftPanel">

<h2>🏙 Buildings</h2>

<button onclick="selectBuild('house')">
🏠 House
</button>

<button onclick="selectBuild('mine')">
⛏ Mine
</button>

<button onclick="selectBuild('lab')">
🧠 Lab
</button>

<button onclick="selectBuild('plant')">
⚡ Energy Plant
</button>

</div>

<div id="rightPanel">

<h2>📋 Selected</h2>

<div id="selectedInfo">
Nothing selected
</div>

</div>

<div id="log"></div>

<canvas id="game"></canvas>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

const TILE = 64;

let cameraX = 0;
let cameraY = 0;

let selectedBuild = null;

let game = {

gold:500,
energy:100,
knowledge:0,
token:5,

workers:3,
population:3

};

let buildings = [];

function log(text){

let div =
document.createElement("div");

div.innerText = text;

document
.getElementById("log")
.prepend(div);

}

function selectBuild(type){

selectedBuild = type;

log(
"Build mode: " +
type
);

}

function updateUI(){

gold.innerText =
Math.floor(game.gold);

energy.innerText =
Math.floor(game.energy);

knowledge.innerText =
Math.floor(game.knowledge);

token.innerText =
Math.floor(game.token);

workers.innerText =
Math.floor(game.workers);

population.innerText =
Math.floor(game.population);

}

function drawGrid(){

for(
let x=0;
x<100;
x++
){

for(
let y=0;
y<100;
y++
){

ctx.strokeStyle =
"#10263d";

ctx.strokeRect(
x*TILE-cameraX,
y*TILE-cameraY,
TILE,
TILE
);

}

}

}

function drawBuildings(){

buildings.forEach(b=>{

let px =
b.x*TILE-cameraX;

let py =
b.y*TILE-cameraY;

if(b.type==="house")
ctx.fillStyle="#22c55e";

if(b.type==="mine")
ctx.fillStyle="#f59e0b";

if(b.type==="lab")
ctx.fillStyle="#a855f7";

if(b.type==="plant")
ctx.fillStyle="#00d4ff";

ctx.fillRect(
px+8,
py+8,
48,
48
);

});

}

function render(){

ctx.fillStyle =
"#07131f";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

drawGrid();

drawBuildings();

requestAnimationFrame(render);

}

window.addEventListener(
"keydown",
e=>{

if(e.key==="ArrowLeft")
cameraX-=32;

if(e.key==="ArrowRight")
cameraX+=32;

if(e.key==="ArrowUp")
cameraY-=32;

if(e.key==="ArrowDown")
cameraY+=32;

});

updateUI();

render();

</script>

</body>
</html>
