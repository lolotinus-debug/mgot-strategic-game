<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>MGOT Rogue Strategy</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#050b1a;
    color:white;
}

.container{
    max-width:800px;
    margin:auto;
    padding:20px;
}

.card{
    background:#111827;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:none;
    border-radius:8px;
    background:#0891b2;
    color:white;
    cursor:pointer;
}

.bad{color:#f87171;}
.good{color:#34d399;}
.warn{color:#fbbf24;}
</style>
</head>

<body>

<div class="container">

<h1>🧠 MGOT — ROGUE CIVILIZATION</h1>

<div class="card">
🌍 Stability: <span id="s">100</span><br>
🧠 Knowledge: <span id="k">50</span><br>
⚡ Economy: <span id="e">50</span><br>
👥 Society: <span id="c">50</span>
</div>

<div class="card">

<h3>⚠ CRISIS EVENT</h3>
<div id="event" class="warn">Waiting for disaster...</div>

<button onclick="choice(1)">1) Fix problem (risk economy)</button>
<button onclick="choice(2)">2) Ignore (risk collapse)</button>
<button onclick="choice(3)">3) Invest long-term (slow recovery)</button>

</div>

<div class="card">
<h3>🤖 AI CIVILIZATION</h3>
AI Power: <span id="ai">80</span><br>
Player Power: <span id="p">0</span>
</div>

<div class="card">
<h3>🏆 STATUS</h3>
<div id="status">Survive...</div>
</div>

</div>

<script>

let s=100;
let k=50,e=50,c=50;
let ai=80;

function power(){
return k+e+c;
}

function crisis(){

let events=[
"⚠ Energy shortage hits system",
"⚠ Economic instability rising",
"⚠ Social unrest detected",
"⚠ AI expansion accelerating",
"⚠ Global pressure increasing"
];

document.getElementById("event").innerText =
events[Math.floor(Math.random()*events.length)];
}

function aiTurn(){

ai += Math.random()*15;

if(ai > power()){
k -= 5;
e -= 5;
c -= 5;
s -= 10;

document.getElementById("status").innerHTML =
"<span class='bad'>⚠ AI is dominating your civilization!</span>";
}
}

function choice(x){

crisis();

if(x===1){
k -= 5;
e += 5;
s += 5;
}

if(x===2){
s -= 15;
}

if(x===3){
k += 10;
e -= 5;
s += 2;
}

aiTurn();
update();
check();
}

function check(){

if(s <= 0){
document.getElementById("status").innerHTML =
"<span class='bad'>💀 CIVILIZATION COLLAPSED</span>";
}

if(ai > 200){
document.getElementById("status").innerHTML =
"<span class='bad'>🤖 AI DOMINATED WORLD</span>";
}

if(power() > 300){
document.getElementById("status").innerHTML =
"<span class='good'>🏆 YOU SURVIVED AND DOMINATED</span>";
}
}

function update(){

document.getElementById("s").innerText=Math.floor(s);
document.getElementById("k").innerText=Math.floor(k);
document.getElementById("e").innerText=Math.floor(e);
document.getElementById("c").innerText=Math.floor(c);
document.getElementById("ai").innerText=Math.floor(ai);
document.getElementById("p").innerText=Math.floor(power());
}

setInterval(crisis,4000);

update();

</script>

</body>
</html>
