<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MGOT ONLINE</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#050b1a;
    color:white;
    padding:20px;
}

.container{max-width:900px;margin:auto;}

button{
    width:100%;
    padding:10px;
    margin-top:5px;
    background:#0891b2;
    border:none;
    color:white;
    border-radius:8px;
}

.card{
    background:#0f172a;
    padding:10px;
    margin-bottom:10px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🌍 MGOT ONLINE</h1>

<div class="card">
<input id="name" placeholder="Enter name" style="width:100%;padding:10px;">
<button onclick="start()">Start Game</button>
</div>

<div class="card">
🧠 Knowledge: <span id="k">0</span><br>
⚡ Energy: <span id="e">0</span><br>
👥 Community: <span id="c">0</span>
</div>

<button onclick="act()">🔥 ACT</button>

<div class="card">
<h3>🏆 GLOBAL LEADERBOARD</h3>
<div id="board"></div>
</div>

</div>

<script>

// 🔥 FIREBASE CONFIG (sem sem dáš svoj z console)
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT",
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

let user = "";
let k=0,e=0,c=0;

function start(){
user = document.getElementById("name").value;
if(!user) return alert("Enter name");

save();
loadBoard();
}

function act(){
k+=5;e+=5;c+=5;
save();
}

function save(){
if(!user) return;

db.collection("players").doc(user).set({
name:user,
knowledge:k,
energy:e,
community:c,
score:k+e+c
});
}

function loadBoard(){

db.collection("players")
.orderBy("score","desc")
.onSnapshot(snapshot=>{

let html="";

snapshot.forEach(doc=>{
let d = doc.data();
html += `<div>${d.name} — ${d.score}</div>`;
});

document.getElementById("board").innerHTML = html;

});
}

// UI update
setInterval(()=>{
document.getElementById("k").innerText=k;
document.getElementById("e").innerText=e;
document.getElementById("c").innerText=c;
},500);

</script>

</body>
</html>
