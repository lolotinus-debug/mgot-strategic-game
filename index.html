<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGOT AAA Map Engine</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#050b1a;
    font-family:Arial;
    color:white;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    z-index:10;
    background:rgba(0,0,0,0.4);
    padding:10px;
    border:1px solid #24314f;
    border-radius:10px;
    font-size:13px;
}

canvas{
    display:block;
}
</style>
</head>

<body>

<div id="ui">
<b>MGOT AAA MAP</b><br>
Zoom: scroll<br>
Move: drag mouse<br>
Click city
<div id="info"></div>
</div>

<canvas id="map"></canvas>

<script>

const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// CAMERA
let camera = {
    x:0,
    y:0,
    zoom:1
};

// CITIES (world coords)
let cities = [
    {name:"Capital", x:500, y:300, pop:100},
    {name:"North City", x:900, y:200, pop:60},
    {name:"East Port", x:1200, y:600, pop:80},
    {name:"West Farm", x:200, y:500, pop:40}
];

// REGIONS (AAA feature)
let regions = [
    {name:"Empire Core", x:300, y:200, w:500, h:400, color:"rgba(59,130,246,0.15)"},
    {name:"Frontier", x:800, y:200, w:600, h:500, color:"rgba(34,197,94,0.10)"}
];

// INPUT
let dragging = false;
let last = {x:0,y:0};

canvas.addEventListener("mousedown",(e)=>{
    dragging = true;
    last.x = e.clientX;
    last.y = e.clientY;
});

canvas.addEventListener("mouseup",()=> dragging=false);

canvas.addEventListener("mousemove",(e)=>{
    if(dragging){
        camera.x += (e.clientX - last.x)/camera.zoom;
        camera.y += (e.clientY - last.y)/camera.zoom;
        last.x = e.clientX;
        last.y = e.clientY;
    }
});

canvas.addEventListener("wheel",(e)=>{
    e.preventDefault();
    camera.zoom *= e.deltaY < 0 ? 1.1 : 0.9;
});

// CLICK CITY
canvas.addEventListener("click",(e)=>{
    let mx = (e.clientX - canvas.width/2)/camera.zoom - camera.x;
    let my = (e.clientY - canvas.height/2)/camera.zoom - camera.y;

    for(let c of cities){
        if(Math.hypot(c.x-mx,c.y-my)<20){
            document.getElementById("info").innerHTML =
            "<br><b>"+c.name+"</b><br>Pop: "+c.pop;
        }
    }
});

// DRAW LOOP
function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.scale(camera.zoom,camera.zoom);
    ctx.translate(-camera.x,-camera.y);

    // BACKGROUND GRID (AAA STYLE)
    drawGrid();

    // REGIONS
    for(let r of regions){
        ctx.fillStyle = r.color;
        ctx.fillRect(r.x,r.y,r.w,r.h);

        ctx.fillStyle = "white";
        ctx.font = "20px Arial";
        ctx.fillText(r.name, r.x+10, r.y+30);
    }

    // CITIES
    for(let c of cities){
        ctx.beginPath();
        ctx.fillStyle = "#fbbf24";
        ctx.arc(c.x,c.y,10,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="white";
        ctx.font="14px Arial";
        ctx.fillText(c.name, c.x+12, c.y-12);
    }

    ctx.restore();

    requestAnimationFrame(draw);
}

// GRID
function drawGrid(){
    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    ctx.lineWidth = 1;

    let step = 100;

    for(let x=-2000;x<2000;x+=step){
        ctx.beginPath();
        ctx.moveTo(x,-2000);
        ctx.lineTo(x,2000);
        ctx.stroke();
    }

    for(let y=-2000;y<2000;y+=step){
        ctx.beginPath();
        ctx.moveTo(-2000,y);
        ctx.lineTo(2000,y);
        ctx.stroke();
    }
}

draw();

</script>

</body>
</html>
