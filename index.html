<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGOT - Strategy Base</title>

<style>
body {
font-family: Arial;
background: radial-gradient(circle,#0b1220,#020617);
color:white;
text-align:center;
margin:0;
padding:20px;
}

.container {
max-width:650px;
margin:auto;
background:rgba(255,255,255,0.05);
padding:20px;
border-radius:12px;
box-shadow:0 0 25px rgba(0,212,255,0.15);
backdrop-filter: blur(10px);
}

h1 {
color:#00d4ff;
}

.resources, .stats {
display:flex;
justify-content:space-around;
padding:10px;
background:rgba(0,0,0,0.3);
border-radius:10px;
margin-bottom:15px;
}

.resource, .stat {
font-weight:bold;
}

.actions {
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

button {
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
transition:0.2s;
}

button:hover {
transform:scale(1.03);
}

.green{background:#22c55e;color:white;}
.blue{background:#00d4ff;color:black;}
.orange{background:#f97316;color:white;}
.red{background:#ef4444;color:white;}

.log {
margin-top:15px;
height:120px;
overflow:auto;
background:rgba(0,0,0,0.4);
padding:10px;
border-radius:8px;
font-size:13px;
text-align:left;
color:#aaa;
}
</style>
</head>

<body>

<div class="container">

<h1>⚔️ MGOT BASE</h1>

<div class="resources">
<div>🪵 Wood: <span id="wood">100</span></div>
<div>🍎 Food: <span id="food">50</span></div>
<div>💰 Gold: <span id="gold">0</span></div>
</div>

<div class="stats">
<div>🧍 Units: <span id="workers">2</span> / <span id="maxWorkers">5</span></div>
<div>🏠 Buildings: <span id="houses">1</span></div>
<div>⛏️ Mines: <span id="mines">0</span></div>
<div>🛡️ Base HP: <span id="hp">100</span></div>
</div>

<div class="actions">

<button class="green" onclick="gather('wood')">🪵 Gather Wood</button>
<button class="green" onclick="gather('food')">🍎 Gather Food</button>

<button class="blue" onclick="buyWorker()">🧍 Recruit Unit (50 Food)</button>

<button class="orange" onclick="build('house')">🏠 Build House</button>
<button class="orange" onclick="build('mine')">⛏️ Build Mine</button>

<button class="red" onclick="attack()">⚔️ Attack Enemy</button>

</div>

<div class="log" id="log">Welcome to MGOT Base.</div>

</div>

<script>

// ================= MGOT STATE =================
let game = {
wood:100,
food:50,
gold:0,
workers:2,
maxWorkers:5,
houses:1,
mines:0,
hp:100
};

// ================= ACTIONS =================
function gather(type){
game[type] += 1;
update();
}

// ================= RECRUIT =================
function buyWorker(){
if(game.food >= 50 && game.workers < game.maxWorkers){
game.food -= 50;
game.workers += 1;
log("Unit recruited.");
update();
}
}

// ================= BUILD =================
function build(type){

if(type === "house" && game.wood >= 50){
game.wood -= 50;
game.houses++;
game.maxWorkers += 5;
game.hp += 20;
log("House built (+population +HP)");

}

if(type === "mine" && game.wood >= 80){
game.wood -= 80;
game.mines++;
log("Mine built (+gold income)");
}

update();
}

// ================= ATTACK SYSTEM (NEW MGOT FEATURE) =================
function attack(){

let enemyHP = 80 + Math.random()*120;
let damage = game.workers * 10 + game.mines * 5;

enemyHP -= damage;

if(enemyHP <= 0){
game.gold += 50;
log("Victory! Enemy base destroyed (+50 gold)");
} else {
game.hp -= 20;
log("Attack failed. You lost HP.");
}

update();
}

// ================= AUTO ECONOMY =================
setInterval(()=>{

game.wood += game.workers * 0.5;
game.food += game.workers * 0.3;
game.gold += game.mines * game.workers * 0.2;

update();

},1000);

// ================= UI =================
function update(){

document.getElementById("wood").innerText = Math.floor(game.wood);
document.getElementById("food").innerText = Math.floor(game.food);
document.getElementById("gold").innerText = Math.floor(game.gold);
document.getElementById("workers").innerText = game.workers;
document.getElementById("maxWorkers").innerText = game.maxWorkers;
document.getElementById("houses").innerText = game.houses;
document.getElementById("mines").innerText = game.mines;
document.getElementById("hp").innerText = game.hp;

}

// ================= LOG =================
function log(text){
let div = document.getElementById("log");
div.innerHTML += "<br>➤ " + text;
div.scrollTop = div.scrollHeight;
}

// INIT
update();

</script>

</body>
</html>
