<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGOT - Mindset Growth System</title>

<style>
body {
margin:0;
font-family: Arial;
background: radial-gradient(circle,#050816,#020617);
color:white;
text-align:center;
padding:20px;
}

.container {
max-width:750px;
margin:auto;
background:rgba(255,255,255,0.04);
padding:20px;
border-radius:14px;
box-shadow:0 0 40px rgba(0,212,255,0.15);
}

h1 {
color:#00d4ff;
letter-spacing:2px;
}

.resources, .stats {
display:flex;
justify-content:space-around;
flex-wrap:wrap;
gap:10px;
background:rgba(0,0,0,0.3);
padding:10px;
border-radius:10px;
margin-bottom:15px;
}

.card {
padding:5px 10px;
font-weight:bold;
}

.actions {
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

button {
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
transition:0.2s;
}

button:hover {
transform:scale(1.03);
}

.blue{background:#00d4ff;color:black;}
.green{background:#22c55e;}
.purple{background:#a855f7;}
.orange{background:#f97316;}
.red{background:#ef4444;}

.log {
margin-top:15px;
height:140px;
overflow:auto;
background:rgba(0,0,0,0.4);
padding:10px;
border-radius:10px;
text-align:left;
font-size:13px;
color:#aaa;
}
</style>
</head>

<body>

<div class="container">

<h1>⚔️ MGOT SYSTEM</h1>
<p>Mindset Growth Optimization Engine</p>

<div class="resources">

<div class="card">⚡ Energy: <span id="energy">100</span></div>
<div class="card">🧠 Knowledge: <span id="knowledge">50</span></div>
<div class="card">💠 MGOT Tokens: <span id="tokens">0</span></div>
<div class="card">🎯 Focus: <span id="focus">10</span></div>

</div>

<div class="stats">

<div class="card">🧍 Agents: <span id="agents">2</span></div>
<div class="card">🏗 Systems: <span id="systems">1</span></div>
<div class="card">📈 Efficiency: <span id="eff">1.0</span></div>

</div>

<div class="actions">

<button class="green" onclick="gather('energy')">⚡ Optimize Energy</button>
<button class="green" onclick="gather('knowledge')">🧠 Learn Knowledge</button>

<button class="purple" onclick="recruit()">🧍 Deploy Agent (50 Knowledge)</button>

<button class="orange" onclick="buildSystem()">🏗 Build System</button>

<button class="blue" onclick="convert('energyToTokens')">⚡→💠 Convert Energy</button>
<button class="blue" onclick="convert('knowledgeToTokens')">🧠→💠 Convert Knowledge</button>

<button class="red" onclick="challenge()">⚔️ MGOT Challenge</button>

</div>

<div class="log" id="log">MGOT System initialized...</div>

</div>

<script>

// ================= MGOT CORE STATE =================
let game = {
energy:100,
knowledge:50,
tokens:0,
focus:10,
agents:2,
systems:1,
eff:1.0
};

// ================= GROWTH =================
function gather(type){
game[type] += 1 * game.eff;
log("Optimized " + type);
update();
}

// ================= AGENTS =================
function recruit(){
if(game.knowledge >= 50){
game.knowledge -= 50;
game.agents += 1;
game.eff += 0.1;
log("Agent deployed → efficiency increased");
update();
}
}

// ================= SYSTEM BUILD =================
function buildSystem(){
if(game.energy >= 60){
game.energy -= 60;
game.systems += 1;
game.focus += 2;
log("System built → focus expanded");
update();
}
}

// ================= VALUE CONVERSION =================
function convert(type){

if(type === "energyToTokens" && game.energy >= 10){
game.energy -= 10;
game.tokens += 1;
log("Energy converted → MGOT token");
}

if(type === "knowledgeToTokens" && game.knowledge >= 10){
game.knowledge -= 10;
game.tokens += 1;
log("Knowledge converted → MGOT token");
}

update();
}

// ================= CHALLENGE SYSTEM =================
function challenge(){

let difficulty = 50 + Math.random()*100;
let power = game.agents*10 + game.systems*8 + game.focus*2 + game.tokens*3;

if(power > difficulty){
game.tokens += 20;
log("Challenge passed → +20 MGOT tokens");
} else {
game.focus -= 2;
log("Challenge failed → focus decreased");
}

update();
}

// ================= AUTO LOOP =================
setInterval(()=>{

game.energy += game.agents * 0.5;
game.knowledge += game.agents * 0.3;
game.tokens += game.systems * 0.2;

update();

},1000);

// ================= UI =================
function update(){

document.getElementById("energy").innerText = Math.floor(game.energy);
document.getElementById("knowledge").innerText = Math.floor(game.knowledge);
document.getElementById("tokens").innerText = Math.floor(game.tokens);
document.getElementById("focus").innerText = game.focus;
document.getElementById("agents").innerText = game.agents;
document.getElementById("systems").innerText = game.systems;
document.getElementById("eff").innerText = game.eff.toFixed(1);

}

// ================= LOG =================
function log(text){
let d = document.getElementById("log");
d.innerHTML += "<br>➤ " + text;
d.scrollTop = d.scrollHeight;
}

update();

</script>

</body>
</html>
