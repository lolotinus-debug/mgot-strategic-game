<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGOT Economy Upgrade</title>

<style>
body {
font-family: Arial;
background: radial-gradient(circle,#0b1220,#020617);
color:white;
text-align:center;
margin:0;
padding:20px;
}

.container {
max-width:700px;
margin:auto;
background:rgba(255,255,255,0.05);
padding:20px;
border-radius:12px;
box-shadow:0 0 25px rgba(0,212,255,0.15);
}

h1 { color:#00d4ff; }

.resources, .stats {
display:flex;
justify-content:space-around;
padding:10px;
background:rgba(0,0,0,0.3);
border-radius:10px;
margin-bottom:15px;
flex-wrap:wrap;
gap:10px;
}

.actions {
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

button {
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
transition:0.2s;
}

button:hover { transform:scale(1.03); }

.green{background:#22c55e;}
.blue{background:#00d4ff;color:black;}
.orange{background:#f97316;}
.yellow{background:#eab308;}
.red{background:#ef4444;}

.log {
margin-top:15px;
height:130px;
overflow:auto;
background:rgba(0,0,0,0.4);
padding:10px;
border-radius:8px;
text-align:left;
font-size:13px;
color:#aaa;
}
</style>
</head>

<body>

<div class="container">

<h1>⚔️ MGOT ECONOMY SYSTEM</h1>

<div class="resources">
<div>🪵 Wood: <span id="wood">100</span></div>
<div>🍎 Food: <span id="food">50</span></div>
<div>💰 Gold: <span id="gold">0</span></div>
<div>🪨 Stone: <span id="stone">0</span></div>
</div>

<div class="stats">
<div>🧍 Units: <span id="workers">2</span></div>
<div>🏠 Houses: <span id="houses">1</span></div>
<div>⛏️ Mines: <span id="mines">0</span></div>
<div>🏦 Economy Level: <span id="eco">1</span></div>
</div>

<div class="actions">

<button class="green" onclick="gather('wood')">🪵 Gather Wood</button>
<button class="green" onclick="gather('food')">🍎 Gather Food</button>
<button class="yellow" onclick="gather('stone')">🪨 Gather Stone</button>

<button class="blue" onclick="buyWorker()">🧍 Recruit Unit (50 Food)</button>

<button class="orange" onclick="buildHouse()">🏠 Build House (50 Wood)</button>
<button class="orange" onclick="buildMine()">⛏️ Build Mine (80 Wood)</button>

<button class="red" onclick="attack()">⚔️ Attack Enemy</button>

<!-- TRADE SYSTEM -->
<button onclick="trade('goldToWood')">💱 1 Gold → 1 Wood</button>
<button onclick="trade('goldToFood')">💱 1 Gold → 1 Food</button>

</div>

<div class="log" id="log">MGOT Economy online...</div>

</div>

<script>

// ================= MGOT STATE =================
let game = {
wood:100,
food:50,
gold:0,
stone:0,
workers:2,
houses:1,
mines:0,
eco:1
};

// ================= GATHER =================
function gather(type){
game[type] += 1 * game.eco;
update();
}

// ================= RECRUIT =================
function buyWorker(){
if(game.food >= 50){
game.food -= 50;
game.workers += 1;
log("Unit recruited.");
update();
}
}

// ================= BUILD =================
function buildHouse(){
if(game.wood >= 50){
game.wood -= 50;
game.houses++;
game.eco += 0.2;
log("House built (+economy boost)");
update();
}
}

function buildMine(){
if(game.wood >= 80){
game.wood -= 80;
game.mines++;
log("Mine built (+gold production)");
update();
}
}

// ================= ATTACK =================
function attack(){

let enemy = 100 + Math.random()*150;
let power = game.workers*10 + game.mines*8 + game.stone*2;

if(power > enemy){
game.gold += 50;
log("Victory! +50 gold");
} else {
game.food -= 10;
log("Defeat! You lost food");
}

update();
}

// ================= TRADE SYSTEM (NEW) =================
function trade(type){

if(type === "goldToWood" && game.gold >= 1){
game.gold -= 1;
game.wood += 1;
log("Trade: 1 Gold → 1 Wood");
}

if(type === "goldToFood" && game.gold >= 1){
game.gold -= 1;
game.food += 1;
log("Trade: 1 Gold → 1 Food");
}

update();
}

// ================= AUTO ECONOMY =================
setInterval(()=>{

game.wood += game.workers * 0.5 * game.eco;
game.food += game.workers * 0.3 * game.eco;
game.gold += game.mines * 0.3;
game.stone += game.workers * 0.1;

update();

},1000);

// ================= UI =================
function update(){

document.getElementById("wood").innerText = Math.floor(game.wood);
document.getElementById("food").innerText = Math.floor(game.food);
document.getElementById("gold").innerText = Math.floor(game.gold);
document.getElementById("stone").innerText = Math.floor(game.stone);
document.getElementById("workers").innerText = game.workers;
document.getElementById("houses").innerText = game.houses;
document.getElementById("mines").innerText = game.mines;
document.getElementById("eco").innerText = game.eco.toFixed(1);

}

// ================= LOG =================
function log(text){
let div = document.getElementById("log");
div.innerHTML += "<br>➤ " + text;
div.scrollTop = div.scrollHeight;
}

// INIT
update();

</script>

<script>

// ================= MGOT CORE STATE =================
let game = {
wood:100,
food:50,
gold:0,
stone:0,

tokens:10,

workers:2,
houses:1,
mines:0,
eco:1
};

// ================= UPGRADES TREE =================
let upgrades = {
gathering: 0,
workers: 0,
housing: 0,
goldBoost: 0,
tokenMulti: 0
};

// ================= GATHER (COST TOKENS) =================
function gather(type){

let cost = 1;

if(game.tokens < cost){
log("❌ Not enough MGOT Tokens");
return;
}

game.tokens -= cost;
game[type] += 1 * game.eco;

log("Gathered " + type + " (-1 token)");
update();
}

// ================= RECRUIT =================
function buyWorker(){

if(game.tokens >= 5){
game.tokens -= 5;
game.workers += 1;
log("🧍 Worker recruited (-5 tokens)");
update();
}
}

// ================= BUILD =================
function buildHouse(){

if(game.tokens >= 8 && game.wood >= 50){
game.tokens -= 8;
game.wood -= 50;
game.houses++;
game.eco += 0.2;
log("🏠 House built (+eco)");
update();
}
}

function buildMine(){

if(game.tokens >= 10 && game.wood >= 80){
game.tokens -= 10;
game.wood -= 80;
game.mines++;
log("⛏️ Mine built");
update();
}
}

// ================= GOLD → TOKEN CONVERSION =================
// 1000 GOLD = 1 TOKEN
function convertGoldToToken(){

if(game.gold >= 1000){
game.gold -= 1000;
game.tokens += 1;
log("💰 1000 Gold → 1 MGOT Token");
update();
} else {
log("❌ Need 1000 Gold");
}

}

// ================= ATTACK =================
function attack(){

let enemy = 100 + Math.random()*150;
let power = game.workers*10 + game.mines*8 + game.stone*2;

if(power > enemy){
game.gold += 50;
log("⚔️ Victory +50 gold");
} else {
game.food -= 10;
log("⚔️ Defeat -10 food");
}

update();
}

// ================= AUTO ECONOMY =================
setInterval(()=>{

game.wood += game.workers * 0.5 * game.eco;
game.food += game.workers * 0.3 * game.eco;
game.gold += game.mines * 0.3;
game.stone += game.workers * 0.1;

update();

},1000);

// ================= UPGRADE SYSTEM =================
function buyUpgrade(type){

switch(type){

case "gathering":
if(game.tokens >= 3){
game.tokens -= 3;
upgrades.gathering++;
game.eco += 0.1;
log("🔵 Gathering upgraded");
}
break;

case "workers":
if(game.tokens >= 5){
game.tokens -= 5;
upgrades.workers++;
game.workers += 1;
log("🔵 Worker upgraded");
}
break;

case "housing":
if(game.tokens >= 4){
game.tokens -= 4;
upgrades.housing++;
game.eco += 0.2;
log("🔵 Housing upgraded");
}
break;

case "goldBoost":
if(game.tokens >= 6){
game.tokens -= 6;
upgrades.goldBoost++;
log("🟢 Gold boost upgraded");
}
break;

case "tokenMulti":
if(game.tokens >= 10){
game.tokens -= 10;
upgrades.tokenMulti++;
log("🔴 Token multiplier upgraded");
}
break;

}

update();
}

// ================= UI UPDATE =================
function update(){

document.getElementById("wood").innerText = Math.floor(game.wood);
document.getElementById("food").innerText = Math.floor(game.food);
document.getElementById("gold").innerText = Math.floor(game.gold);
document.getElementById("stone").innerText = Math.floor(game.stone);

document.getElementById("workers").innerText = game.workers;
document.getElementById("houses").innerText = game.houses;
document.getElementById("mines").innerText = game.mines;
document.getElementById("eco").innerText = game.eco.toFixed(1);

}

// ================= LOG =================
function log(text){
let div = document.getElementById("log");
div.innerHTML += "<br>➤ " + text;
div.scrollTop = div.scrollHeight;
}

update();

</script>

</body>
</html>
