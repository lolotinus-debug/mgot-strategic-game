<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MGOT Clash Strategy v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    background:#020617;
    font-family:Arial;
    color:white;
}

canvas {
    display:block;
    background: radial-gradient(circle,#0f172a,#020617);
}

#ui {
    position:absolute;
    top:10px;
    left:10px;
    background:rgba(0,0,0,0.7);
    padding:10px;
    border-radius:10px;
    width:260px;
    font-size:13px;
}

button {
    margin:3px;
    padding:5px;
    width:100%;
    background:#0ea5e9;
    border:none;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

.legend {
    margin-top:10px;
    font-size:12px;
    color:#94a3b8;
}
</style>
</head>

<body>

<div id="ui">
<div>🧠 MGOT Gold: <span id="gold">100</span></div>
<div>🏛 HQ Level: <span id="hq">1</span></div>

<button onclick="place('mine')">Build ⛏ Mine</button>
<button onclick="place('barracks')">Build 🪖 Barracks</button>
<button onclick="place('wall')">Build 🧱 Wall</button>
<button onclick="train()">Train Troop</button>

<div class="legend">
⛏ Mine = income<br>
🪖 Barracks = spawn troops<br>
🧱 Wall = defense<br>
🏛 HQ = base core
</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const GRID=40;

let gold=100;
let hqLevel=1;

let mode="place";
let placeType=null;

let buildings=[
    {x:5,y:5,type:"hq",hp:500,level:1}
];

let enemyBuildings=[
    {x:15,y:8,type:"hq",hp:500},
    {x:14,y:8,type:"mine",hp:100},
    {x:16,y:9,type:"barracks",hp:100}
];

let troops=[];

// ================= UI ACTIONS =================
function place(type){
    mode="place";
    placeType=type;
}

function train(){
    if(gold<10) return;
    gold-=10;
    troops.push({x:5,y:5,target:null,hp:50});
}

function upgradeHQ(){
    if(gold<50) return;
    gold-=50;
    buildings[0].level++;
    hqLevel++;
}

// ================= GAME LOGIC =================
function getIncome(){
    buildings.forEach(b=>{
        if(b.type==="mine"){
            gold += 0.1 * (b.level||1);
        }
    });
}

function spawnAI(){
    if(Math.random()<0.01){
        enemyBuildings.push({x:15,y:8,type:"soldier",hp:30});
    }
}

function updateTroops(){
    troops.forEach(t=>{
        let target = enemyBuildings[0];

        if(!target) return;

        if(t.x<target.x) t.x++;
        if(t.x>target.x) t.x--;
        if(t.y<target.y) t.y++;
        if(t.y>target.y) t.y--;

        // attack
        if(Math.abs(t.x-target.x)<1 && Math.abs(t.y-target.y)<1){
            target.hp -= 5;

            if(target.hp<=0){
                enemyBuildings.splice(enemyBuildings.indexOf(target),1);
                gold += 20;
            }
        }
    });
}

// ================= BUILDING =================
canvas.addEventListener("click",(e)=>{
    const r=canvas.getBoundingClientRect();
    const x=Math.floor((e.clientX-r.left)/GRID);
    const y=Math.floor((e.clientY-r.top)/GRID);

    if(mode==="place"){
        let hp=100;

        if(placeType==="hq") hp=500;

        buildings.push({x,y,type:placeType,hp,level:1});
    }

    troops.forEach(t=>{
        t.target={x,y};
    });
});

// ================= DRAW =================
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // grid
    ctx.strokeStyle="#1e293b";
    for(let x=0;x<canvas.width/GRID;x++){
        for(let y=0;y<canvas.height/GRID;y++){
            ctx.strokeRect(x*GRID,y*GRID,GRID,GRID);
        }
    }

    // buildings
    buildings.forEach(b=>{
        ctx.fillStyle=
            b.type==="hq"?"#00d4ff":
            b.type==="mine"?"#22c55e":
            b.type==="barracks"?"#f97316":
            "#64748b";

        ctx.fillRect(b.x*GRID,b.y*GRID,GRID-2,GRID-2);
    });

    // enemy
    enemyBuildings.forEach(b=>{
        ctx.fillStyle="#ff3b3b";
        ctx.fillRect(b.x*GRID,b.y*GRID,GRID-2,GRID-2);
    });

    // troops
    troops.forEach(t=>{
        ctx.fillStyle="#ffffff";
        ctx.fillRect(t.x*GRID,t.y*GRID,GRID-2,GRID-2);
    });
}

// ================= LOOP =================
function loop(){
    getIncome();
    spawnAI();
    updateTroops();

    document.getElementById("gold").innerText=Math.floor(gold);
    document.getElementById("hq").innerText=hqLevel;

    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
