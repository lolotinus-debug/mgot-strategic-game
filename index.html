<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>MGOT CIVILIZATION LIGHT</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#050b1a;
    color:white;
}

.header{
    text-align:center;
    padding:15px;
    color:#22d3ee;
    font-size:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    max-width:1100px;
    margin:auto;
    padding:15px;
}

.panel{
    background:#111827;
    padding:15px;
    border-radius:12px;
}

button{
    width:100%;
    padding:10px;
    margin-top:6px;
    background:#0891b2;
    border:none;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.node{
    padding:10px;
    margin-top:6px;
    background:#0f172a;
    border-radius:8px;
}

.ai{
    color:#f87171;
}

.player{
    color:#34d399;
}
</style>
</head>

<body>

<div class="header">🧠 MGOT CIVILIZATION LIGHT (MAX)</div>

<div class="grid">

<!-- PLAYER -->
<div class="panel">

<h3 class="player">👤 PLAYER CIVILIZATION</h3>

🧠 Knowledge: <span id="k">50</span><br>
⚡ Energy: <span id="e">50</span><br>
👥 Community: <span id="c">50</span><br>

<hr>

<button onclick="build('lab')">📚 Build Lab</button>
<button onclick="build('plant')">⚡ Build Energy</button>
<button onclick="build('hub')">🤝 Build Community</button>

<hr>

<h3>🌍 MAP CONTROL</h3>

<div class="node" onclick="capture('EU')">EU</div>
<div class="node" onclick="capture('US')">US</div>
<div class="node" onclick="capture('ASIA')">ASIA</div>

<hr>

<button onclick="nextTurn()">▶ NEXT TURN</button>

</div>

<!-- AI -->
<div class="panel">

<h3 class="ai">🤖 AI CIVILIZATION</h3>

AI Power: <span id="ai">100</span><br>

<hr>

<div id="event">World is stable...</div>

<hr>

<h3>📊 STATUS</h3>

Player Power: <span id="pp">0</span><br>
AI Power: <span id="ap">0</span><br>

<hr>

<h3>🏆 WIN CONDITION</h3>
<div id="win">Reach 1000 power to win</div>

</div>

</div>

<script>

let k=50,e=50,c=50;

let lab=0,plant=0,hub=0;

let ai=100;

let regions={};

function build(type){

if(type==="lab" && k>=50){k-=50; lab++;}
if(type==="plant" && e>=50){e-=50; plant++;}
if(type==="hub" && c>=50){c-=50; hub++;}

update();
}

function capture(r){
regions[r]=true;
update();
}

function aiTurn(){

let choice = Math.random();

if(choice<0.33) ai += 20;
else if(choice<0.66) ai += 10;
else ai -= 5;

if(Math.random()<0.3){
k -= 5;
e -= 5;
c -= 5;
document.getElementById("event").innerText = "⚠ AI attacked your economy!";
}
}

function calcPower(){
return k+e+c + lab*20 + plant*20 + hub*20;
}

function nextTurn(){

// player growth
k += lab*5;
e += plant*5;
c += hub*5;

// AI growth
aiTurn();

// map bonuses
if(regions.EU) k += 5;
if(regions.US) e += 5;
if(regions.ASIA) c += 5;

// stability pressure
if(ai > calcPower()){
k -= 5;
e -= 5;
c -= 5;
document.getElementById("event").innerText = "🔥 AI is stronger than you!";
}

// win/lose
if(calcPower() > 1000){
document.getElementById("win").innerText = "🏆 YOU WIN (MGOT DOMINANCE)";
}

if(ai > 1200){
document.getElementById("win").innerText = "💀 YOU LOST (AI DOMINATES)";
}

update();
}

function update(){

document.getElementById("k").innerText=Math.floor(k);
document.getElementById("e").innerText=Math.floor(e);
document.getElementById("c").innerText=Math.floor(c);

document.getElementById("ai").innerText=Math.floor(ai);

document.getElementById("pp").innerText=Math.floor(calcPower());
document.getElementById("ap").innerText=Math.floor(ai);

}

update();

</script>

</body>
</html>
