<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MGOT Strategy Upgrade</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:#020617;
font-family:Arial;
overflow:hidden;
color:white;
}

#topbar{
position:fixed;
top:0;left:0;
width:100%;height:60px;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
gap:20px;
border-bottom:2px solid #00d4ff;
z-index:100;
}

.resource{color:#00d4ff;font-weight:bold;}

#leftPanel{
position:fixed;
left:10px;top:80px;
width:260px;
background:#0f172a;
padding:15px;
border-radius:10px;
}

#leftPanel button{
width:100%;
margin-bottom:10px;
padding:10px;
background:#00d4ff;
border:none;
cursor:pointer;
font-weight:bold;
border-radius:6px;
color:black;
text-align:left;
}

#rightPanel{
position:fixed;
right:10px;top:80px;
width:280px;
background:#0f172a;
padding:15px;
border-radius:10px;
}

#log{
position:fixed;
bottom:10px;
left:10px;
width:420px;
height:180px;
overflow:auto;
background:#000;
padding:10px;
font-size:12px;
border-radius:10px;
}

canvas{display:block;}
</style>
</head>

<body>

<div id="topbar">
<div class="resource">💰 Gold: <span id="gold">500</span></div>
<div class="resource">⚡ Energy: <span id="energy">100</span></div>
<div class="resource">🧠 Knowledge: <span id="knowledge">0</span></div>
<div class="resource">💠 MGOT: <span id="token">5</span></div>
<div class="resource">👥 Population: <span id="population">3</span></div>
</div>

<div id="leftPanel">
<h3>🏗 Buildings</h3>

<button onclick="selectBuild('house')">
🏠 House — 100💰
</button>

<button onclick="selectBuild('mine')">
⛏ Mine — 150💰
</button>

<button onclick="selectBuild('lab')">
🧠 Lab — 200💰
</button>

<button onclick="selectBuild('plant')">
⚡ Plant — 200💰
</button>
</div>

<div id="rightPanel">
<h3>📋 Info</h3>
<div id="selectedInfo">Nothing selected</div>
<button onclick="upgradeBuilding()">⬆ Upgrade</button>
</div>

<div id="log"></div>
<canvas id="game"></canvas>

<script>

// ================= INIT =================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const TILE = 64;

let cameraX = 0;
let cameraY = 0;

let selectedBuild = null;
let selectedBuilding = null;

let game = {
gold:500,
energy:100,
knowledge:0,
token:5,
population:3
};

let buildings = [];

// ================= BUILD COSTS =================
const BUILDINGS = {
house:{cost:100, color:"#22c55e"},
mine:{cost:150, color:"#f59e0b"},
lab:{cost:200, color:"#a855f7"},
plant:{cost:200, color:"#00d4ff"}
};

// ================= LOG =================
function log(t){
const d=document.createElement("div");
d.innerText=t;
document.getElementById("log").prepend(d);
}

// ================= UI =================
function updateUI(){
document.getElementById("gold").innerText=Math.floor(game.gold);
document.getElementById("energy").innerText=Math.floor(game.energy);
document.getElementById("knowledge").innerText=Math.floor(game.knowledge);
document.getElementById("token").innerText=Math.floor(game.token);
document.getElementById("population").innerText=Math.floor(game.population);
}

// ================= SELECT =================
function selectBuild(type){
selectedBuild = type;
log("Build: " + type);
}

// ================= INFO PANEL =================
function updateSelected(){
const box = document.getElementById("selectedInfo");

if(!selectedBuilding){
box.innerHTML="Nothing selected";
return;
}

let prod = "";

if(selectedBuilding.type==="mine")
prod = "⛏ +gold/sec: " + (2*selectedBuilding.level);

if(selectedBuilding.type==="lab")
prod = "🧠 +knowledge/sec: " + (1*selectedBuilding.level);

if(selectedBuilding.type==="plant")
prod = "⚡ +energy/sec: " + (2*selectedBuilding.level);

if(selectedBuilding.type==="house")
prod = "👥 population boost";

box.innerHTML = `
<b>Type:</b> ${selectedBuilding.type}<br>
<b>Level:</b> ${selectedBuilding.level}<br>
<b>Upgrade:</b> ${selectedBuilding.level*100}💰<br>
<b>Info:</b> ${prod}
`;
}

// ================= UPGRADE =================
function upgradeBuilding(){
if(!selectedBuilding) return;

let cost = selectedBuilding.level * 100;

if(game.gold < cost){
log("❌ Not enough gold");
return;
}

game.gold -= cost;
selectedBuilding.level++;

log("⬆ Upgraded " + selectedBuilding.type + " → Lv." + selectedBuilding.level);

updateSelected();
updateUI();
}

// ================= CLICK =================
canvas.addEventListener("click",(e)=>{
const r = canvas.getBoundingClientRect();

const x = Math.floor((e.clientX - r.left + cameraX)/TILE);
const y = Math.floor((e.clientY - r.top + cameraY)/TILE);

// select existing
for(let b of buildings){
if(b.x===x && b.y===y){
selectedBuilding=b;
updateSelected();
return;
}
}

// build new
if(!selectedBuild) return;

let b = BUILDINGS[selectedBuild];

if(game.gold < b.cost){
log("❌ Not enough gold");
return;
}

game.gold -= b.cost;

buildings.push({
x,y,
type:selectedBuild,
level:1
});

log("🏗 Built " + selectedBuild);

updateUI();
});

// ================= ECONOMY =================
setInterval(()=>{

for(let b of buildings){

if(b.type==="mine") game.gold += 2*b.level;
if(b.type==="lab") game.knowledge += 1*b.level;
if(b.type==="plant") game.energy += 2*b.level;

}

game.population = 3 + buildings.filter(b=>b.type==="house").length*2;

updateUI();

},1000);

// ================= DRAW =================
function drawGrid(){
for(let x=0;x<100;x++){
for(let y=0;y<100;y++){
ctx.strokeStyle="#10263d";
ctx.strokeRect(x*TILE-cameraX,y*TILE-cameraY,TILE,TILE);
}
}
}

// ===== SHAPES =====
function drawBuildingShape(b,x,y,color){

ctx.fillStyle=color;

if(b.type==="house"){
ctx.beginPath();
ctx.moveTo(x+32,y+8);
ctx.lineTo(x+56,y+56);
ctx.lineTo(x+8,y+56);
ctx.closePath();
ctx.fill();
}

if(b.type==="mine"){
ctx.fillRect(x+10,y+10,44,44);
}

if(b.type==="lab"){
ctx.beginPath();
ctx.arc(x+32,y+32,22,0,Math.PI*2);
ctx.fill();
}

if(b.type==="plant"){
ctx.fillRect(x+20,y+8,24,48);
}

}

// ================= BUILDINGS =================
function drawBuildings(){
for(let b of buildings){

let x = b.x*TILE-cameraX;
let y = b.y*TILE-cameraY;

drawBuildingShape(b,x,y,BUILDINGS[b.type].color);

ctx.fillStyle="white";
ctx.font="12px Arial";
ctx.fillText("Lv."+b.level,x+10,y+18);

if(selectedBuilding===b){
ctx.strokeStyle="#fff";
ctx.lineWidth=3;
ctx.strokeRect(x+4,y+4,56,56);
}
}
}

// ================= RENDER =================
function render(){
ctx.fillStyle="#07131f";
ctx.fillRect(0,0,canvas.width,canvas.height);

drawGrid();
drawBuildings();

requestAnimationFrame(render);
}

// ================= CAMERA =================
window.addEventListener("keydown",(e)=>{
if(e.key==="ArrowLeft") cameraX-=32;
if(e.key==="ArrowRight") cameraX+=32;
if(e.key==="ArrowUp") cameraY-=32;
if(e.key==="ArrowDown") cameraY+=32;
});

// START
updateUI();
render();

</script>

</body>
</html>
