<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>MGOT MULTIPLAYER CORE</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#050b1a;
    color:white;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#0f172a;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
}

input, button{
    width:100%;
    padding:10px;
    margin-top:8px;
    border-radius:8px;
    border:none;
}

button{
    background:#0891b2;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>🌍 MGOT MULTIPLAYER PLATFORM</h1>

<div class="card">
<input id="name" placeholder="Enter player name">
<button onclick="start()">JOIN WORLD</button>
</div>

<div class="card">
<h3>🧠 YOUR CIVILIZATION</h3>
🧠 Knowledge: <span id="k">0</span><br>
⚡ Economy: <span id="e">0</span><br>
👥 Society: <span id="c">0</span><br>

<button onclick="action('research')">🧠 Research</button>
<button onclick="action('economy')">⚡ Economy</button>
<button onclick="action('society')">👥 Society</button>
</div>

<div class="card">
<h3>🏆 GLOBAL LEADERBOARD</h3>
<div id="board"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore,
doc,
setDoc,
collection,
onSnapshot,
query,
orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_PROJECT"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let user="";
let k=0,e=0,c=0;

window.start = function(){
user = document.getElementById("name").value;
if(!user) return alert("Enter name");
save();
loadBoard();
}

window.action = function(type){

if(type==="research") k += 10;
if(type==="economy") e += 10;
if(type==="society") c += 10;

save();
update();
}

async function save(){
if(!user) return;

await setDoc(doc(db,"players",user),{
name:user,
k,e,c,
power:k+e+c
});
}

function loadBoard(){

const q = query(collection(db,"players"),orderBy("power","desc"));

onSnapshot(q,(snap)=>{

let html="";

snap.forEach(d=>{
let p = d.data();
html += `<div>${p.name} — ${p.power}</div>`;
});

document.getElementById("board").innerHTML = html;

});
}

function update(){
document.getElementById("k").innerText=k;
document.getElementById("e").innerText=e;
document.getElementById("c").innerText=c;
}

setInterval(update,500);

</script>

</body>
</html>
