<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGOT Civilization FULL</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#020617;
    color:white;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    color:#22d3ee;
}

.top{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:15px;
}

.box{
    background:#0f172a;
    padding:15px;
    text-align:center;
    border-radius:10px;
}

.era{
    background:#0f172a;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    text-align:center;
}

button{
    width:100%;
    padding:10px;
    margin-top:5px;
    background:#0891b2;
    border:none;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

button:hover{opacity:0.9}

.tree{
    margin-top:10px;
}

.node{
    background:#0f172a;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.locked{opacity:0.4}

.progress{
    height:10px;
    background:#1e293b;
    border-radius:10px;
    overflow:hidden;
}

.fill{
    height:100%;
    width:0%;
    background:#22d3ee;
}
</style>
</head>

<body>

<div class="container">

<h1>🧠 MGOT CIVILIZATION</h1>

<div class="top">
<div class="box">🧠 <div id="k">0</div></div>
<div class="box">⚡ <div id="e">0</div></div>
<div class="box">👥 <div id="c">0</div></div>
</div>

<div class="era">
⭐ Era: <span id="era">Individual</span>
<br><br>
<div class="progress"><div class="fill" id="bar"></div></div>
</div>

<button onclick="act()">🔥 ACT (train & grow)</button>

<div class="tree">

<div class="node" id="n1">
📚 Discipline I (+Energy/sec)
<button onclick="buy('n1',50,'k')">50 🧠</button>
</div>

<div class="node" id="n2">
🎯 Focus I (+Knowledge/sec)
<button onclick="buy('n2',50,'k')">50 🧠</button>
</div>

<div class="node" id="n3">
🤝 Social Awareness (+Community/sec)
<button onclick="buy('n3',50,'k')">50 🧠</button>
</div>

<div class="node locked" id="n4">
🗣 Communication (+Community boost)
<button onclick="buy('n4',120,'c')">120 👥</button>
</div>

<div class="node locked" id="n5">
🧠 Knowledge System (+50% Knowledge)
<button onclick="buy('n5',300,'k')">300 🧠</button>
</div>

</div>

</div>

<script>

let k=0,e=0,c=0;
let era=0;

let n={};

function act(){
k+=2;
e+=2;
c+=2;
update();
}

function buy(id,cost,type){

if(type==="k" && k>=cost) k-=cost;
else if(type==="c" && c>=cost) c-=cost;
else return;

n[id]=true;
document.getElementById(id).classList.add("active");

unlock();
update();
}

function unlock(){

if(n.n1){
document.getElementById("n4").classList.remove("locked");
}

if(n.n2){
document.getElementById("n5").classList.remove("locked");
}

}

function total(){return k+e+c;}

function eraCheck(){

let t=total();

if(t>100) era=1;
if(t>400) era=2;
if(t>1200) era=3;
if(t>3000) era=4;

let names=[
"🧍 Individual",
"👥 Tribe",
"🏫 Academy",
"🏙️ City",
"🌍 Global Network"
];

document.getElementById("era").innerText=names[era];
}

function update(){

document.getElementById("k").innerText=Math.floor(k);
document.getElementById("e").innerText=Math.floor(e);
document.getElementById("c").innerText=Math.floor(c);

document.getElementById("bar").style.width=(total()%100)+"%";

eraCheck();
save();
}

setInterval(()=>{

// passive income system
if(n.n1) e+=0.6;
if(n.n2) k+=0.6;
if(n.n3) c+=0.6;
if(n.n5) k*=1.001;

update();

},1000);

function save(){
localStorage.setItem("mgot_full",JSON.stringify({k,e,c,era,n}));
}

function load(){
let d=JSON.parse(localStorage.getItem("mgot_full"));
if(!d)return;

k=d.k||0;
e=d.e||0;
c=d.c||0;
era=d.era||0;
n=d.n||{};

for(let id in n){
if(n[id]){
let el=document.getElementById(id);
if(el) el.classList.add("active");
}
}
}

load();
update();

</script>

</body>
</html>
