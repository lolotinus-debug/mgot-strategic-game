<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGOT World Strategy</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
margin:0;
padding:0;
box-sizing:border-box;
background:#020617;
font-family:Arial, sans-serif;
overflow:hidden;
color:white;
}

/* ================= TOPBAR ================= */

#topbar{
position:fixed;
top:0;
left:0;
width:100%;
height:60px;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
gap:15px;
border-bottom:2px solid #00d4ff;
z-index:100;
font-size:14px;
padding:0 10px;
}

.resource{
color:#00d4ff;
font-weight:bold;
}

/* ================= LEFT PANEL ================= */

#leftPanel{
position:fixed;
left:10px;
top:80px;
width:260px;
background:#0f172a;
padding:12px;
border-radius:10px;
z-index:50;
}

#leftPanel h3{
margin-bottom:10px;
}

#leftPanel button{
width:100%;
margin-bottom:8px;
padding:10px;
border:none;
cursor:pointer;
font-weight:bold;
border-radius:6px;
text-align:left;
background:#00d4ff;
color:black;
transition:0.2s;
}

#leftPanel button:hover{
transform:scale(1.02);
}

/* ================= RIGHT PANEL ================= */

#rightPanel{
position:fixed;
right:10px;
top:80px;
width:280px;
background:#0f172a;
padding:12px;
border-radius:10px;
z-index:50;
}

#rightPanel h3{
margin-bottom:10px;
}

#rightPanel button{
width:100%;
margin-top:10px;
padding:10px;
border:none;
cursor:pointer;
font-weight:bold;
border-radius:6px;
background:#00d4ff;
color:black;
}

/* ================= INFO ================= */

#info{
line-height:1.5;
font-size:14px;
}

/* ================= LOG ================= */

#log{
position:fixed;
bottom:10px;
left:10px;
width:420px;
height:180px;
overflow:auto;
background:#000;
padding:10px;
font-size:12px;
border-radius:10px;
z-index:50;
}

#log::-webkit-scrollbar{
width:6px;
}

#log::-webkit-scrollbar-thumb{
background:#00d4ff;
border-radius:10px;
}

/* ================= CANVAS ================= */

canvas{
display:block;
position:absolute;
left:0;
top:0;
width:100vw;
height:100vh;
}

/* ================= MOBILE ================= */

@media (max-width:768px){

#topbar{
height:auto;
min-height:60px;
font-size:11px;
gap:8px;
padding:6px;
flex-wrap:wrap;
}

/* BUILDINGS PANEL */

#leftPanel{
left:5px;
bottom:5px;
top:auto;

width:48%;
max-height:220px;

overflow-y:auto;

padding:8px;
}

/* INFO PANEL */

#rightPanel{
right:5px;
bottom:5px;
top:auto;

width:48%;
padding:8px;
}

/* BUTTONS */

#leftPanel button,
#rightPanel button{
font-size:14px;
padding:12px;
}

/* INFO */

#info{
font-size:12px;
}

/* LOG */

#log{
width:95%;
height:90px;

left:50%;
transform:translateX(-50%);

bottom:240px;

font-size:10px;
}

/* CANVAS */

canvas{
width:100vw;
height:100vh;
}

/* SCROLL */

#leftPanel::-webkit-scrollbar{
width:4px;
}

#leftPanel::-webkit-scrollbar-thumb{
background:#00d4ff;
border-radius:10px;
}

}

/* EXTRA SMALL PHONES */

@media (max-width:480px){

#topbar{
font-size:10px;
gap:5px;
}

#leftPanel{
width:47%;
}

#rightPanel{
width:47%;
}

#leftPanel button,
#rightPanel button{
font-size:12px;
padding:10px;
}

#log{
height:80px;
font-size:9px;
}

}
</style>
</head>

<body>

<div id="topbar">
<div class="resource">💰 Gold: <span id="gold">500</span></div>
<div class="resource">⚡ Energy: <span id="energy">100</span></div>
<div class="resource">👥 Population: <span id="population">10</span></div>
<div class="resource">🧠 Knowledge: <span id="knowledge">0</span></div>
<div class="resource">🔬 Tech: <span id="tech">1</span></div>
<div class="resource">🪖 Soldiers: <span id="soldiers">0</span></div>
<div class="resource">🌍 Continent: Map</div>

</div>

<div id="leftPanel">
<h3>🏗 Buildings</h3>

<button onclick="selectBuild('house')">🏠 House (100)</button>
<button onclick="selectBuild('mine')">⛏ Mine (150)</button>
<button onclick="selectBuild('lab')">🧠 Lab (200)</button>
<button onclick="selectBuild('plant')">⚡ Plant (200)</button>

<hr style="margin:10px 0;border:1px solid #333">

<button onclick="selectBuild('armory')">🪖 Armory (300)</button>
<button onclick="selectBuild('forge')">🔨 Forge (300)</button>
</div>

<div id="rightPanel">
<h3>📋 Info</h3>
<div id="info">Nothing selected</div>
<button onclick="upgrade()">⬆ Upgrade</button>
  
<button onclick="newGame()">🆕 New Game</button>
  
</div>

<div id="log"></div>
<canvas id="game"></canvas>

<script>

// ================= INIT =================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
const dpr = window.devicePixelRatio || 1;

canvas.width = window.innerWidth * dpr;
canvas.height = window.innerHeight * dpr;

canvas.style.width = window.innerWidth + "px";
canvas.style.height = window.innerHeight + "px";

ctx.setTransform(dpr,0,0,dpr,0,0);
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const TILE = 64;

let cameraX = 0;
let cameraY = 0;

function selectBuild(t){
  selectedBuild = t;

  document.querySelectorAll("#leftPanel button").forEach(b=>{
    b.style.outline="none";
  });

  if(window.event?.target){
    window.event.target.style.outline="2px solid white";
  }

  document.getElementById("info").innerHTML = `
    <b>Selected:</b> ${t}<br>
    💰 Cost: ${B[t].cost}<br>
    📍 Click map to place
  `;

  log("Build: " + t);
}
  
let selected = null;
let selectedBuild = null;

let particles = [];

let game = {
gold:500,
energy:100,
knowledge:0,
soldiers:0,
population:10,
technologyLevel:1
};

let buildings = [];

// ================= BUILD COSTS =================
const B = {
house:{cost:100,color:"#22c55e"},
mine:{cost:150,color:"#f59e0b"},
lab:{cost:200,color:"#a855f7"},
plant:{cost:200,color:"#00d4ff"},
armory:{cost:300,color:"#ef4444"},
forge:{cost:300,color:"#eab308"}
};

// ================= LOG =================
function log(t){
const d=document.createElement("div");
d.innerText=t;
document.getElementById("log").prepend(d);
}

// ================= PARTICLES (EXPLOSION) =================
function explosion(x,y,color){
for(let i=0;i<12;i++){
particles.push({
x,y,
vx:(Math.random()-0.5)*6,
vy:(Math.random()-0.5)*6,
life:30,
color
});
}
}

// ================= UPDATE UI =================
function ui(){
document.getElementById("gold").innerText=Math.floor(game.gold);
document.getElementById("energy").innerText=Math.floor(game.energy);
document.getElementById("knowledge").innerText=Math.floor(game.knowledge);
document.getElementById("tech").innerText=game.technologyLevel;
document.getElementById("soldiers").innerText=Math.floor(game.soldiers);
document.getElementById("population").innerText=Math.floor(game.population);
}

// ================= INFO =================
function updateInfo(){
if(!selected){
document.getElementById("info").innerHTML="Nothing selected";
return;
}

document.getElementById("info").innerHTML=`
<b>${selected.type}</b><br>
Level: ${selected.level}<br>
Upgrade cost: ${selected.level*120}<br>
`;
}

// ================= UPGRADE =================
function upgrade(){
if(!selected) return;

let cost = selected.level*120;

if(game.gold<cost){
log("❌ Not enough gold");
return;
}

game.gold-=cost;
selected.level++;

explosion(selected.x*TILE,selected.y*TILE,"#fff");

log("⬆ Upgraded "+selected.type);
ui();
updateInfo();
}

// ================= CLICK =================
canvas.addEventListener("click",(e)=>{
  
const rect = canvas.getBoundingClientRect();

const x = Math.floor(
(e.clientX - rect.left + cameraX) / TILE
);

const y = Math.floor(
(e.clientY - rect.top + cameraY) / TILE
);

console.log("CLICK WORLD:", x, y, selectedBuild);
console.log("CLICK DETECTED");
console.log("selectedBuild:", selectedBuild);
  
// select
for(let b of buildings){
if(b.x===x&&b.y===y){
selected=b;
updateInfo();
return;
}
}

// build
if(!selectedBuild) return;

let cost=B[selectedBuild].cost;

if(game.gold<cost){
log("❌ Not enough gold");
return;
}

game.gold-=cost;

buildings.push({
x,y,
type:selectedBuild,
level:1,
cooldown:0
});

console.log("ADDED BUILDING:", buildings);

explosion(x*TILE,y*TILE,B[selectedBuild].color);

log("🏗 "+selectedBuild+" built");
ui();
});

// ================= ECONOMY =================
setInterval(()=>{

for(let b of buildings){

if(b.type==="house"){
game.population += 0.05 * b.level;
}

if(b.type==="mine"){
let workers = b.level*2;
if(game.population >= workers){
game.gold += b.level;
}
}

if(b.type==="lab"){
if(game.energy > 0){
game.knowledge += b.level;
game.energy -= 0.5*b.level;
}
}

if(b.type==="plant"){
game.energy += 3*b.level;
}

if(b.type==="armory"){
b.cooldown++;
if(b.cooldown>=5){
game.soldiers+=b.level;
b.cooldown=0;
}
}

if(b.type==="forge"){
game.soldiers+=Math.floor(b.level/2);
}

}

game.gold -= game.soldiers * 0.02;
if(game.gold < 0) game.gold = 0;

if(game.knowledge >= 100){
game.technologyLevel++;
game.knowledge = 0;
log("🧠 New Technology Level: " + game.technologyLevel);
}

ui();

},1000);
  
// ================= MAP ZONES =================
function drawMap(){
for(let x=0;x<50;x++){
for(let y=0;y<50;y++){

let color="#0b1b2b";

// Europe zone
if(x<15) color="#0f172a";

// Africa zone
else if(x<30) color="#0a2a1a";

// Asia zone
else color="#2a1a0a";

ctx.fillStyle=color;
ctx.fillRect(x*TILE-cameraX,y*TILE-cameraY,TILE,TILE);

}
}
}

// ================= BUILDINGS =================
function drawBuildings(){
for(let b of buildings){

let px=b.x*TILE-cameraX;
let py=b.y*TILE-cameraY;

ctx.fillStyle=B[b.type].color;

// SHAPES
if(b.type==="house"){
ctx.beginPath();
ctx.moveTo(px+32,py+10);
ctx.lineTo(px+54,py+54);
ctx.lineTo(px+10,py+54);
ctx.closePath();
ctx.fill();
}

if(b.type==="mine") ctx.fillRect(px+10,py+10,44,44);

if(b.type==="lab"){
ctx.beginPath();
ctx.arc(px+32,py+32,22,0,Math.PI*2);
ctx.fill();
}

if(b.type==="plant"){
ctx.fillRect(px+26,py+8,12,48);
}

if(b.type==="armory"){
ctx.fillRect(px+18,py+18,28,28);
ctx.strokeStyle="red";
ctx.strokeRect(px+10,py+10,44,44);
}

if(b.type==="forge"){
ctx.beginPath();
ctx.arc(px+32,py+32,18,0,Math.PI*2);
ctx.fill();
ctx.strokeStyle="yellow";
ctx.strokeRect(px+8,py+8,48,48);
}

// level
ctx.fillStyle="white";
ctx.font="12px Arial";
ctx.fillText("Lv."+b.level,px+8,py+16);

// select highlight
if(selected===b){
ctx.strokeStyle="#fff";
ctx.lineWidth=3;
ctx.strokeRect(px+4,py+4,56,56);
}
}
}

// ================= PARTICLES =================
function drawParticles(){
for(let p of particles){
ctx.fillStyle=p.color;
ctx.fillRect(p.x-cameraX,p.y-cameraY,3,3);

p.x+=p.vx;
p.y+=p.vy;
p.life--;

}
particles=particles.filter(p=>p.life>0);
}

setInterval(()=>{

localStorage.setItem(
"mgot_save",
JSON.stringify({
game,
buildings
})
);

},5000);

const save =
localStorage.getItem("mgot_save");

if(save){

try{

const data = JSON.parse(save);

if(data.game) game = data.game;
if(data.buildings) buildings = data.buildings;

}catch(err){

console.log("Save corrupted");

}

}

// ================= RENDER =================
function render(){

ctx.fillStyle="#07131f";
ctx.fillRect(
0,
0,
window.innerWidth,
window.innerHeight
);

drawMap();
drawBuildings();
drawParticles();

requestAnimationFrame(render);
}

// ================= CAMERA =================
window.addEventListener("keydown",(e)=>{
if(e.key==="ArrowLeft") cameraX-=32;
if(e.key==="ArrowRight") cameraX+=32;
if(e.key==="ArrowUp") cameraY-=32;
if(e.key==="ArrowDown") cameraY+=32;
});
function newGame(){

if(!confirm("Start a new game?")){
return;
}

localStorage.removeItem("mgot_save");

game = {
gold:500,
energy:100,
knowledge:0,
soldiers:0,
population:10,
technologyLevel:1
};

buildings = [];
particles = [];
selected = null;
selectedBuild = null;

cameraX = 0;
cameraY = 0;

ui();

document.getElementById("info").innerHTML =
"Nothing selected";

}
// START
ui();
render();

</script>

</body>
</html>
